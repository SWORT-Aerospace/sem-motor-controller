  coast_mode: null                 # to be decided by measurement (EFFICIENCY_RESEARCH.md H3)
  notes: null

supervision:
  update_period_s: null            # 50 Hz is PROVISIONAL and simulation-only
  timeout_s: null                  # 100 ms is PROVISIONAL and simulation-only
  timing_status: provisional_simulation_only
  limits_timeout_s: null
