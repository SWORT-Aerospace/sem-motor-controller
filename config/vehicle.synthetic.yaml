# ===========================================================================
#  SYNTHETIC SIMULATION CONFIGURATION: NOT A REAL VEHICLE, NOT A REAL MOTOR
# ===========================================================================
# Every number below was chosen by the developer so that host simulation,
# tests and model development can proceed while the real motor/battery are
# unknown. None of it is measured or taken from a datasheet. It is internally
# consistent (it passes the cross-parameter rules) but that says nothing about
# any real hardware.
#
# provenance: synthetic  =>  physical_output_permitted MUST be false. The
# validator rejects any synthetic configuration that tries to enable a
# physical output, and the hardware build mode rejects synthetic provenance.
schema_version: 1
label: "SYNTHETIC - simulation only"
conventions:
  units: SI
  battery_current_positive: discharge
  phase_current_positive: into_motor_terminal
  torque_positive: forward_motoring
  clarke: amplitude_invariant
  resistance: line_to_neutral
  inductance: line_to_neutral
  flux_linkage: peak_phase_amplitude_invariant
  temperature: degC
  angle: rad_electrical_from_phase_a_axis

calibration:
  id: "SYNTH-0001"
  version: 1
  provenance: synthetic
  physical_output_permitted: false
  measured_by: null
  measured_at: null
  instrument_refs: null
  notes: "Synthetic values for host simulation only."

motor:
  type: pmsm_sinusoidal
  model: "SYNTHETIC-PMSM-A (fictional)"
  pole_pairs: 4
  phase_resistance_ohm: 0.10
  resistance_ref_temp_degC: 25.0
  d_inductance_H: 1.5e-4
  q_inductance_H: 1.5e-4
  flux_linkage_Wb: 0.010            # Kt = 1.5*p*lambda = 0.06 N*m/A (peak)
  rated_mech_speed_rad_s: 300.0
  max_mech_speed_rad_s: 450.0
  continuous_phase_current_A_rms: 15.0
  peak_phase_current_A: 40.0
  peak_current_duration_s: 10.0
  max_winding_temp_degC: 120.0
  rotor_sensor: hall
  hall_supply_V: 5.0
  hall_angle_offset_rad: 0.0
  hall_code_to_sector: [-1, 0, 2, 1, 4, 5, 3, -1]   # 120-degree halls, 1-3-2-6-4-5
  inertia_kg_m2: 2.0e-4
  notes: null

battery:
  chemistry: li_ion_nmc
  series_cells: 12
  min_voltage_V: 36.0
  nominal_voltage_V: 43.2
  max_charged_voltage_V: 50.4
  bms_max_discharge_current_A: 30.0
  bms_peak_discharge_current_A: 60.0
  bms_peak_duration_s: 10.0
  bms_max_charge_current_A: 5.0
  notes: null

vehicle:
  category: prototype
  competition_event: "SYNTHETIC"
  mass_with_driver_kg: 100.0
  gear_ratio: 10.0
  wheel_circumference_m: 1.50
  freewheel_present: true
  drivetrain_efficiency: 0.95
  notes: null

inverter:
  bus_voltage_rating_V: 75.0
  transient_margin_fraction: 0.25
  shunt_ohm: 0.001
  amp_gain_V_per_V: 20.0
  adc_vref_V: 3.3
  adc_bits: 12
  current_offset_counts: [2048.0, 2048.0, 2048.0]
  vbus_divider_ratio: 20.0
  hw_overcurrent_trip_A: 70.0
  pwm_frequency_Hz: 20000.0
  deadtime_s: 2.0e-7
  fet_temp_derate_start_degC: 85.0
  fet_temp_trip_degC: 110.0
  duty_min: 0.02
  duty_max: 0.98
  current_kp_V_per_A: 0.94          # ~1 kHz current-loop bandwidth for L = 150 uH
  current_ki_V_per_A_s: 628.0       # zero at R/L
  voltage_limit_fraction: 0.95
  current_sample_settle_s: 1.5e-6          # SYNTHETIC: 0.5 us ringing + 1.0 us CSA settle (assumed)
  notes: null

limits:
  max_motor_torque_Nm: 2.0
  manual_max_torque_Nm: 2.0
  max_phase_current_A: 40.0
  battery_current_limit_A: 30.0
  regen_enabled: false
  regen_current_limit_A: 0.0
  min_efficiency_for_limit: 0.7
  overspeed_trip_rad_s: 450.0
  speed_taper_start_rad_s: 400.0
  undervoltage_derate_V: 38.0
  undervoltage_trip_V: 36.0
  overvoltage_trip_V: 56.0
  motor_temp_derate_start_degC: 90.0
  motor_temp_trip_degC: 110.0
  torque_slew_up_Nm_s: 5.0
  torque_slew_down_Nm_s: 10.0
  torque_slew_down_fast_Nm_s: 100.0
  unknown_temperature_derate_factor: 0.5
  throttle_release_threshold: 0.05
  throttle_engage_threshold: 0.10
  software_overcurrent_A: 55.0
  coast_mode: gate_off
  notes: null

supervision:
  update_period_s: 0.02            # PROVISIONAL 50 Hz, simulation only
  timeout_s: 0.10                  # PROVISIONAL 100 ms, simulation only
  timing_status: provisional_simulation_only
  limits_timeout_s: 0.5
  can_id_base: 768                 # 0x300: protocol default for host tests. PROPOSED, NOT allocated on any real bus.
  can_bitrate_bps: null                # not used by the host simulation
  hazard_analysis_ref: null
  notes: "Provisional supervision timing pending vehicle hazard/latency analysis."

controls:                            # wired pedal calibration, measured at the connector (not used by the host simulation)
  throttle_a_released_V: null
  throttle_a_full_V: null
  throttle_b_released_V: null
  throttle_b_full_V: null
  throttle_track_tolerance: null
  throttle_divider_ratio: null

power:                               # precharge sequencing (not used by the host simulation)
  precharge_complete_fraction: null
  precharge_timeout_s: null

sensing:                             # temperature sensors (not used by the host simulation)
  fet_ntc_r25_ohm: null
  fet_ntc_beta_K: null
  fet_ntc_bias_ohm: null
  motor_ntc_r25_ohm: null
  motor_ntc_beta_K: null
  motor_ntc_bias_ohm: null
  phase_current_polarity: null
  current_offset_tolerance_counts: null
