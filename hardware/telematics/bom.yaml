usage:
  # live uplink volume for the recurring cost (sem.telemetry.v4 at 2 Hz); the message size is measured from the
  # telematics demonstration's stored payloads by tools/telematics_bom.py when available, else this value
  message_bytes_assumed: 1500
  mqtt_overhead_bytes: 40
  rate_hz: 2.0
  running_hours_per_month: {low: 2, high: 20}    # practice and attempts, assumption to be replaced by the team's plan

supply:
  battery_max_V: null
  battery_source: "docs/BATTERY.md: 48 V nominal, 10 Ah as the vehicle team reports it; the maximum charged voltage is not stated (B-BAT-V)"
  rule:
    - "TVS standoff voltage at least V_bat,max (the TVS must not conduct on a full pack)"
    - "TVS clamp voltage at its surge current at most the DC-DC's absolute maximum input, or a surge stopper between them"
    - "DC-DC rated input range covering V_bat,min to V_bat,max"
    - "fuse, fuse holder and reverse diode rated above V_bat,max"
  checked_pairs:
    - {tvs: SMBJ58A, tvs_standoff_V: 58.0, tvs_clamp_V: 93.6, tvs_clamp_at_A: 6.4,
