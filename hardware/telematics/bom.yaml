# Telematics-only bill of materials (v0.7). Read by tools/telematics_bom.py, which writes docs/TELEMATICS_BOM.md
# and docs/generated/telematics_bom.json. NOTHING HAS BEEN ORDERED. No price below is a quote.
#
# Scope: the telematics unit only. The motor controller is built by another team; none of its parts are here, and
# this list is priced from its own lines, not by subtracting anything from the old combined budget (that budget,
# docs/BUDGET.md and hardware/bom/, stays as the historical record of the deferred controller development).
#
# Configurations:
#   A  development and local logging: NUCLEO-U575ZI-Q, CAN receive, wheel, IMU, GNSS + PPS, temperatures,
#      persistent storage, supply protection and DC-DC, connectors, harness, enclosure
#   B  A plus the LTE uplink; the driver display is optional and totalled separately
#   recurring  connectivity per month (B only)
#   equipment  bench tools, only if not owned; never in A or B
#
# Evidence: snippet = a price seen in a search-result snapshot retrieved on `retrieved` (no live page could be read
# from this environment: DNS failures and a proxy refusal, not retried); allowance = an estimate with its reasoning.
# Every line keeps its source. A null price stays null and is reported, never filled in. Prices in USD at qty 1;
# a line whose only snapshot is in another currency is an allowance in USD with that snapshot in `source`.
#
# Vehicle: 48 V nominal, 10 Ah, as reported by the vehicle team (docs/BATTERY.md); the maximum pack voltage is not
# known, so the supply protection below assumes a 13S lithium-ion pack (54.6 V full) and must be re-checked when
# the team states the pack.

