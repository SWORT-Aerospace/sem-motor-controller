# Footprint assignment for every BOM line (hardware/bom/BOM_draft.csv), hand-maintained.
# Read by tools/gen_kicad_schematic.py (Footprint field of each symbol, BOM footprint column), by
# tools/price_bom.py (footprint and package columns) and checked by tools/check_footprints.py, which writes
# FOOTPRINT_CHECK.md.
#
# disposition:
#   verified                  footprint assigned and checked (pin-to-pad, pads, courtyard, fabrication outline,
#                             orientation convention, pinned library file); the package is the selection for a
#                             generic part (value + package), so no manufacturer drawing is needed beyond the
#                             library's land pattern
#   assigned_drawing_pending  footprint assigned and checked the same way, but the part is a specific device:
#                             its manufacturer's package drawing has not been read, so the land pattern is not
#                             confirmed
#   rating_dependent          no footprint: the package follows from a rating that waits for the battery or motor
#   datasheet_dependent       no footprint: the value or pin voltage comes from an unread data sheet
#   connector_dependent       no footprint: the connector family waits for the harness
#   pinout_blocked            no footprint: the symbol's pins are placeholders
# Library: KiCad footprints 8.0.9 (the project's KiCad release), pinned by SHA-256 in library_pins.yaml.
