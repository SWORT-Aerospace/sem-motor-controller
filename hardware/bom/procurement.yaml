# Project procurement: the one authoritative source for the README budget table and docs/PROCUREMENT.md.
# Generate both with `python3 tools/gen_procurement.py`; CI runs `--check`.
#
# Two kinds of cost, never mixed:
#   * unit_cost_usd: a dated quote or listing. Needs price.supplier, price.date (YYYY-MM-DD) and price.reference.
#   * estimate: a reference into the motor-controller pricing (docs/generated/budget.json, written by
#     tools/price_bom.py from hardware/bom/BOM_draft.csv and hardware/bom/pricing.yaml). The generator copies the
#     low-high range from there, so the numbers live in one place. An estimate is not a quote.
#       budget: <field>                  a field of the scenario named in `estimate_scenario`
#       budget: <field>/<item prefix>    one entry of an item list in that scenario
#       budget: <field>@<scenario>       the same field from another scenario
#       pricing: equipment/<item prefix> one bring-up equipment entry of pricing.yaml
# Rules enforced by the generator (it refuses the file otherwise):
#   * status Ordered or Received needs order_evidence (order number, receipt);
#   * `in_assembly: true` marks a part inside the telematics PCB assembly line; it is not counted again;
#   * `optional: true` lines and `not_budgeted` lines are listed but kept out of the subtotals;
#   * unknown quantities and costs stay null and print as TBD, never as zero.
# Nothing here has been ordered, and no line has a dated quote yet.
schema: sem.procurement.v2
updated: "2026-10-17"
currency: USD
statuses: [Candidate, Selected, Ordered, Received, Blocked]
estimate_scenario: S1 one functional prototype
budget:
  overall_usd: [500, 1000]
  scope: unconfirmed
  note: >-
    The project budget is about $500 to $1,000. Which of the lines below it has to cover (controller only, or
    controller, telemetry, wiring and tools) is unconfirmed.
categories:
  motor_controller: Motor controller
  telemetry: Telemetry and sensors
  shared: Shared power, connectors and wiring
  development: Development equipment
  recurring: Recurring connectivity
  contingency: Contingency
items:
  # ---------------------------------------------------------------- motor controller (from the priced draft BOM)
  - id: mc_parts
    item: Controller board parts, one board
    purpose: Every component on the draft motor-controller schematic (100 BOM lines)
    category: motor_controller
    qty: 1
    unit: set
    estimate: {budget: parts}
    status: Blocked
    candidate: hardware/bom/BOM_priced.csv (draft schematic; rating-dependent parts are representatives, not selections)
    requirement: Ratings of the MOSFETs, shunts, bulk capacitors, fuse and TVS follow the battery and motor, not the 48 V nominal alone.
    blocked_by: maximum and minimum pack voltage, discharge and regenerative current limits (battery and BMS datasheets); design review
    evidence: "docs/BUDGET.md"
  - id: mc_spares
    item: Spare parts for bring-up
    purpose: Replacements for the parts most likely to be damaged (MOSFETs, gate driver, shunts, TVS, fuses, CAN transceiver, MCU)
    category: motor_controller
    qty: 1
    unit: set
    estimate: {budget: spares}
    status: Blocked
    candidate: spares list in hardware/bom/pricing.yaml
    requirement: Same part numbers as the board parts.
    blocked_by: the board parts line
    evidence: "docs/BUDGET.md"
  - id: mc_pcb
    item: Controller PCB fabrication (5 boards, 4-layer, 2 oz outer copper)
    purpose: Bare boards for the motor controller
    category: motor_controller
    qty: 1
    unit: order
    estimate: {budget: controller_items/PCB fabrication}
    status: Blocked
    candidate: null
    requirement: A reviewed layout. None exists; the schematic has no footprints.
    blocked_by: footprints, layout and the stage-0 design review (hardware/review/REVIEW_CHECKLIST.md)
    evidence: "docs/BUDGET.md"
  - id: mc_pcb_shipping
    item: Controller PCB shipping
    purpose: Delivery of the boards
    category: motor_controller
    qty: 1
    unit: order
    estimate: {budget: controller_items/PCB shipping}
    status: Blocked
    candidate: null
    requirement: From the fabrication quote.
    blocked_by: the PCB line
    evidence: "docs/BUDGET.md"
  - id: mc_stencil
    item: Solder-paste stencil
    purpose: Hand assembly of the fine-pitch parts
    category: motor_controller
    qty: 1
    unit: order
    estimate: {budget: controller_items/Stencil}
    status: Blocked
    candidate: null
    requirement: Matches the final layout.
    blocked_by: the PCB line
    evidence: "docs/BUDGET.md"
  - id: mc_consumables
    item: Assembly consumables (paste, flux, wick)
    purpose: Board assembly
    category: motor_controller
    qty: 1
    unit: set
    estimate: {budget: controller_items/Assembly consumables}
    status: Candidate
    candidate: null
    requirement: Lead-free or leaded paste matched to the team's reflow method.
    blocked_by: null
    evidence: "docs/BUDGET.md"
  - id: mc_thermal
    item: Thermal interface, heatsink plate and fasteners
    purpose: Carries the power-stage losses away from the MOSFETs
    category: motor_controller
    qty: 1
    unit: set
    estimate: {budget: controller_items/Thermal interface}
    status: Blocked
    candidate: null
    requirement: Sized from the loss estimate at the real current and the mounting in the vehicle.
    blocked_by: motor and battery current; mounting location
    evidence: "docs/BUDGET.md"
  - id: mc_tax
    item: Tax and shipping on the controller parts
    purpose: Distributor shipping and import tax on the two parts lines above
    category: motor_controller
    qty: 1
    unit: order
    estimate: {budget: shipping_tax}
    status: Blocked
    candidate: null
    requirement: From the distributor quote and the delivery country.
    blocked_by: quotes
    evidence: "docs/BUDGET.md"
  - id: mc_enclosure
    item: Controller enclosure and mounting
    purpose: Holds and protects the controller in the vehicle
    category: motor_controller
    qty: 1
    unit: set
    estimate: {budget: incremental_items/Enclosure}
    status: Blocked
    candidate: printed or folded aluminium
    requirement: Fits the mounting location; connections visible and accessible (Article 57k).
    blocked_by: mounting location in the vehicle
    evidence: "docs/BUDGET.md"
  - id: mc_revision
    item: Second controller board revision
    purpose: One more PCB order, shipping, stencil and changed parts if the first board needs a respin
    category: motor_controller
    qty: 1
    unit: set
    optional: true
    estimate: {budget: "revision_allowance@S1R one prototype + one revision"}
    status: Candidate
    candidate: revision allowance in hardware/bom/pricing.yaml (scenario S1R)
    requirement: Only if bring-up of the first board finds a layout defect.
    blocked_by: first-board bring-up
    evidence: "docs/BUDGET.md"
  # ---------------------------------------------------------------- telemetry and sensors
  - id: telematics_pcb
    item: Telematics PCB fabrication and assembly
    purpose: The vehicle telemetry unit (MCU, GNSS, modem, IMU, flash per the team's proposal)
    category: telemetry
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: The team's telematics board (STM32U575, NEO-M9N, A7672, MC3419, NOR flash, BQ25622E per the proposal)
    requirement: >-
      Board files are needed for a quote (bk4000tg_kicad.zip, telemetry.pdf: not received). The proposal's BQ25622E
      charger implies an on-board battery; Article 57b forbids an accessory battery on a Battery Electric vehicle.
      Enclosure transparent or with a transparent cover (Article 57j).
    blocked_by: telematics board files; battery arrangement under Article 57b
    evidence: "docs/RULES_COMPLIANCE.md"
  - id: wheel_hall
    item: Wheel-speed Hall sensor
    purpose: Wheel pulses for vehicle speed and distance
    category: telemetry
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: "Team reference DRV5032: rejected for wheel speed (sampled; misses magnet passes at speed). Comparison: DRV5023-Q1 (continuous), not selected"
    requirement: A continuous (non-sampled) Hall switch; quantity = instrumented wheels (the ICD has three provisional channels).
    blocked_by: maximum vehicle speed, wheel circumference, magnet count and geometry, which wheels are instrumented
    evidence: "docs/generated/wheel_sensor_check.md"
  - id: wheel_magnets
    item: Wheel magnets and mounting hardware
    purpose: Targets for the wheel-speed sensor
    category: telemetry
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Field above the switch operate point across the air gap; magnet count per wheel from the speed resolution needed.
    blocked_by: wheel and hub geometry, sensor choice
    evidence: "docs/generated/wheel_sensor_check.md"
  - id: imu
    item: 6-axis IMU
    purpose: Longitudinal acceleration and yaw rate for analysis (not control)
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Candidate
    candidate: "LSM6DSV or ISM330DHCX (team references); MC3419 from the board proposal has no gyroscope"
    in_assembly: null
    requirement: >-
      Offset calibration at rest is required: a 12 mg offset equals a 1.2 % grade error.
    blocked_by: mounting location, temperature range, whether the PCB assembly already carries an IMU
    evidence: "docs/TELEMETRY_CANDIDATES.md#imu"
  - id: temperature
    item: Temperature sensors/probes
    purpose: Slow temperatures for logging (battery surface, motor case, ambient)
    category: telemetry
    qty: null
    unit_cost_usd: null
    status: Candidate
    candidate: DS18B20 (team reference)
    requirement: Logging only. Not for power-stage protection (750 ms conversion at 12 bit); the controller keeps its own thermal protection. No log record type yet (docs/ICD.md section 8).
    blocked_by: measurement points and count
    evidence: "docs/TELEMETRY_CANDIDATES.md#ds18b20"
  - id: gnss
    item: GNSS receiver/module, if not included in the PCB assembly
    purpose: Position, speed and the PPS time reference
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: NEO-M9N (board proposal)
    in_assembly: null
    requirement: L1 multi-constellation, PPS output for time alignment; 2.7-3.6 V.
    blocked_by: whether the telematics PCB assembly includes it (board files not received)
    evidence: "docs/TELEMETRY_CANDIDATES.md#gnss-neo-m9n"
  - id: gnss_antenna
    item: Active GNSS antenna
    purpose: Sky view for the GNSS receiver
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: L1 band (GPS/QZSS L1C/A, GLONASS L1OF, Galileo E1, BeiDou B1I); supply from the receiver's VCC_RF (VCC - 0.1 V, at most 50 mA); external gain at most 30 dB; mounted with sky view through non-conductive bodywork.
    blocked_by: antenna connector on the carrier board; mounting position
    evidence: "docs/TELEMETRY_CANDIDATES.md#gnss-neo-m9n"
  - id: lte_modem
    item: LTE modem, if not included in the PCB assembly
    purpose: Live summary to the pit over MQTT
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: SIMCom A7672 (board proposal); variant by region (A7672E, A7672SA, A7672S)
    in_assembly: null
    requirement: LTE Cat-1 bands of the event country's operator; MQTT client in the modem firmware.
    blocked_by: event country and operator; whether the PCB assembly includes it
    evidence: "docs/TELEMETRY_CANDIDATES.md#lte-a7672"
  - id: lte_antenna
    item: LTE antenna
    purpose: Cellular link for the modem
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Covers the chosen variant's LTE bands; 50 ohm; one main antenna (the A7672X has no diversity input).
    blocked_by: modem variant, connector, mounting
    evidence: "docs/TELEMETRY_CANDIDATES.md#lte-a7672"
  - id: local_storage
    item: Local log storage (microSD card and socket), if not included in the PCB assembly
    purpose: The complete on-vehicle record (STLG log)
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Candidate
    candidate: microSD (optional in the proposal) in addition to the proposal's 8 MB NOR flash
    in_assembly: null
    requirement: >-
      At least 9.35 KiB/s sustained with erase time (host demonstration rate); a 40-minute attempt needs about 22 MB,
      and the 8 MB flash alone lasts 14.6 minutes. Behaviour on power loss during a write to be checked on the bench.
    blocked_by: whether the PCB assembly has a card socket (board files not received)
    evidence: "docs/ICD.md#9-storage-queues-and-drop-reporting"
  - id: can_xcvr
    item: CAN transceiver/interface, if not included in the PCB assembly
    purpose: Connects the telemetry unit to the vehicle CAN bus
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    in_assembly: null
    requirement: Classic CAN 2.0B or CAN FD per the vehicle bus; 3.3 V logic for the STM32U575 FDCAN1. The Nucleo needs one for bench work too.
    blocked_by: vehicle bus type and bit rate (input sheet Q4); whether the PCB assembly includes it
    evidence: "docs/ICD.md"
  - id: display
    item: Driver display
    purpose: Shows the driver speed, mode and advisories
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: "LED bar \"burn / coast\" (optional in the proposal), or an unmodified self-contained device"
    requirement: >-
      Power arrangement under Article 57i: a built-in battery only if the display is unmodified and self-contained;
      otherwise powered from the vehicle system through the joulemeter. A separate battery for a display is not an
      approved purchase.
    blocked_by: display type decision
    evidence: "docs/RULES_COMPLIANCE.md"
  - id: steering
    item: Optional steering-angle sensor
    purpose: Steering angle for analysis
    category: telemetry
    qty: 1
    unit_cost_usd: null
    status: Blocked
    optional: true
    candidate: AS5600 (team reference), single-turn, needs a diametric magnet on the axis
    requirement: Measured angle range within one turn at the mounting point; magnet 0.5-3 mm air gap, axis displacement at most 0.25 mm (6 mm magnet).
    blocked_by: steering geometry (lock-to-lock angle at the mounting point, mounting)
    evidence: "docs/TELEMETRY_CANDIDATES.md#as5600"
  - id: shipping
    item: Shipping and tax on the telemetry lines
    purpose: Delivery and import tax
    category: telemetry
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: From the supplier quotes.
    blocked_by: quotes
    evidence: null
  # ---------------------------------------------------------------- shared power, connectors and wiring
  - id: power_connectors
