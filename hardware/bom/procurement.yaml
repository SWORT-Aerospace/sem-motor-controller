    category: shared
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    in_assembly: null
    requirement: >-
      From the propulsion battery, downstream of the joulemeter (Articles 56d, 57b). Input rating from the maximum pack
      voltage with transients and margin, not from the 48 V nominal; modem supply 3.4-4.2 V with peaks up to 2 A
      at maximum 2G transmit power (A7672X Hardware Design V1.04 p. 26); fused (Article 57g).
    blocked_by: maximum pack voltage and transients (battery datasheet); whether the PCB assembly includes it
    evidence: "docs/BATTERY.md"
