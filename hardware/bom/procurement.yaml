    purpose: High-current connections between battery, controller and motor
    category: shared
    qty: 1
    unit: set
    estimate: {budget: incremental_items/Battery and motor}
    status: Blocked
    candidate: XT90 pair, MR60 or bullets (representative)
    requirement: Rated for the pack's maximum voltage and current; must match the battery's own connector.
    blocked_by: battery connector type and current (battery datasheet, label photo)
    evidence: "docs/BUDGET.md"
  - id: signal_connectors
    item: Controller signal connectors and crimp terminals
    purpose: Driver controls, Hall, CAN and temperature connections at the controller
    category: shared
    qty: 1
    unit: set
    estimate: {budget: incremental_items/Signal connectors}
    status: Blocked
    candidate: null
    requirement: No splices; connections visible and accessible (Article 57k).
    blocked_by: connector pinouts (input sheet Q5)
    evidence: "docs/BUDGET.md"
  - id: wire
    item: Wire, heat-shrink and sleeving
    purpose: Power wiring (10-12 AWG), signal multicore and CAN twisted pair
    category: shared
    qty: 1
    unit: set
    estimate: {budget: incremental_items/Wire}
    status: Blocked
    candidate: null
    requirement: Gauge from the fused current; lengths from the vehicle layout.
    blocked_by: harness plan and fuse rating
    evidence: "docs/BUDGET.md"
  - id: harness
    item: Telemetry harness (sensor cables and connectors)
    purpose: Wheel, temperature, GNSS and LTE antenna, display and CAN cables to the telemetry unit
    category: shared
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Not covered by the controller signal-connector line above. No splices; connections visible and accessible (Article 57k).
    blocked_by: harness plan and connector pinouts (input sheet Q5)
    evidence: "docs/RULES_COMPLIANCE.md"
  - id: dcdc
    item: Protected DC-DC supply for the telemetry unit, if not included in the PCB assembly
