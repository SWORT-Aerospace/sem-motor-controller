    estimate: {pricing: equipment/Current-limited bench supply}
    status: Blocked
    candidate: null
    requirement: Output above the maximum pack voltage (or two in series), constant-current mode.
    blocked_by: maximum pack voltage (battery datasheet)
    evidence: "docs/BUDGET.md"
  - id: scope
    item: Oscilloscope (100 MHz or more, 4 channels) and differential probe
    purpose: Switch-node, gate and timing measurements during bring-up
    category: development
    qty: 1
    not_budgeted: assumed borrowed from the lab; a differential probe can cost more than the whole budget
    status: Blocked
    candidate: null
    requirement: Needed before the power stage switches at more than the lowest bring-up voltage.
    blocked_by: lab access confirmed
    evidence: "docs/BUDGET.md"
  - id: dmm
    item: Bench multimeters and clamp meter, only if not owned
    purpose: Voltage, current and continuity checks
    category: development
    qty: 1
    estimate: {pricing: equipment/Bench DMM}
    status: Candidate
    candidate: null
    requirement: Two meters; a clamp meter if the team has none (the low end assumes all are owned).
    blocked_by: null
    evidence: "docs/BUDGET.md"
  # ---------------------------------------------------------------- recurring connectivity
  - id: sim
    item: SIM card and data plan
    purpose: Mobile data for the live summary at the event and in testing
    category: recurring
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Coverage at the event; about 0.5 to 7.7 MB per 40-minute attempt at 1 to 5 Hz (docs/COMBINED_ARCHITECTURE.md).
    blocked_by: event country, operator, modem variant
    evidence: "docs/TELEMETRY_CANDIDATES.md#lte-a7672"
  - id: broker_hosting
    item: Internet-reachable MQTT broker
    purpose: The point the modem publishes to and the pit subscribes from
    category: recurring
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: Mosquitto on a hosted server, or a tunnel to the pit computer
