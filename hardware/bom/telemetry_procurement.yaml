# Telemetry procurement: the one authoritative source for the README budget table and docs/PROCUREMENT.md.
# Generate both with `python3 tools/gen_procurement.py`; CI runs `--check`.
#
# Rules enforced by the generator (it refuses the file otherwise):
#   * unit_cost_usd needs price.supplier, price.date (YYYY-MM-DD) and price.reference: a dated quote or listing;
#   * status Ordered or Received needs order_evidence (order number, receipt);
#   * an item marked `in_assembly: true` is part of the telematics PCB assembly line and is not counted again;
#   * unknown quantities and costs stay null and print as TBD; no total is printed for an unknown line.
# Nothing here has been ordered. Distributor sites were unreachable from the build environment (2026-10-16),
# so no line has a dated price yet.
schema: sem.procurement.v1
updated: "2026-10-16"
currency: USD
statuses: [Candidate, Selected, Ordered, Received, Blocked]
budget:
  overall_usd: [500, 1000]
  telemetry_share: unconfirmed
  note: >-
    The project budget is about $500 to $1,000. Whether the telemetry lines below come out of that budget, alongside
    the motor-controller BOM (docs/BUDGET.md), is unconfirmed.
categories:
  development: Development equipment (bench work, not installed in the vehicle)
  vehicle: Installed vehicle hardware
  recurring: Recurring connectivity
  shipping_tax: Shipping and tax
  contingency: Contingency
items:
  - id: nucleo
    item: NUCLEO-U575ZI-Q development board
    category: development
    qty: 1
    unit_cost_usd: null
    status: Candidate
    candidate: NUCLEO-U575ZI-Q (STM32U575ZIT6Q), the MCU named in the telematics proposal
    requirement: Bench development of the telematics firmware; needs an external CAN transceiver (none on the board) and a 5 V supply.
    blocked_by: null
    evidence: "docs/TELEMETRY_CANDIDATES.md#nucleo-u575zi-q"
  - id: telematics_pcb
    item: Telematics PCB fabrication and assembly
    category: vehicle
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: The team's telematics board (STM32U575, NEO-M9N, A7672, MC3419, NOR flash, BQ25622E per the proposal)
    requirement: >-
      Board files are needed for a quote (bk4000tg_kicad.zip, telemetry.pdf: not received). The proposal's BQ25622E
      charger implies an on-board battery; Article 57b forbids an accessory battery on a Battery Electric vehicle.
      Enclosure transparent or with a transparent cover (Article 57j).
    blocked_by: telematics board files; battery arrangement under Article 57b
    evidence: "docs/RULES_COMPLIANCE.md"
  - id: wheel_hall
    item: Wheel-speed Hall sensor
    category: vehicle
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: "Team reference DRV5032: rejected for wheel speed (sampled; misses magnet passes at speed). Comparison: DRV5023-Q1 (continuous), not selected"
    requirement: A continuous (non-sampled) Hall switch; quantity = instrumented wheels (the ICD has three provisional channels).
    blocked_by: maximum vehicle speed, wheel circumference, magnet count and geometry, which wheels are instrumented
    evidence: "docs/generated/wheel_sensor_check.md"
  - id: wheel_magnets
    item: Wheel magnets and mounting hardware
    category: vehicle
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Field above the switch operate point across the air gap; magnet count per wheel from the speed resolution needed.
    blocked_by: wheel and hub geometry, sensor choice
    evidence: "docs/generated/wheel_sensor_check.md"
  - id: imu
    item: 6-axis IMU
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Candidate
    candidate: "LSM6DSV or ISM330DHCX (team references); MC3419 from the board proposal has no gyroscope"
    in_assembly: null
    requirement: >-
      Longitudinal acceleration and yaw rate for analysis, not control. Offset calibration at rest is required: a 12 mg
      offset equals a 1.2 % grade error.
    blocked_by: mounting location, temperature range, whether the PCB assembly already carries an IMU
    evidence: "docs/TELEMETRY_CANDIDATES.md#imu"
  - id: temperature
    item: Temperature sensors/probes
    category: vehicle
    qty: null
    unit_cost_usd: null
    status: Candidate
    candidate: DS18B20 (team reference) for slow temperatures only (battery surface, motor case, ambient)
    requirement: Logging only. Not for power-stage protection (750 ms conversion at 12 bit); the controller keeps its own thermal protection.
    blocked_by: measurement points and count
    evidence: "docs/TELEMETRY_CANDIDATES.md#ds18b20"
  - id: gnss
    item: GNSS receiver/module, if not included in the PCB assembly
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: NEO-M9N (board proposal)
    in_assembly: null
    requirement: L1 multi-constellation, PPS output for time alignment; 2.7-3.6 V.
    blocked_by: whether the telematics PCB assembly includes it (board files not received)
    evidence: "docs/TELEMETRY_CANDIDATES.md#gnss-neo-m9n"
  - id: gnss_antenna
    item: Active GNSS antenna
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: L1 band (GPS/QZSS L1C/A, GLONASS L1OF, Galileo E1, BeiDou B1I); supply from the receiver's VCC_RF (VCC - 0.1 V, at most 50 mA); external gain at most 30 dB; mounted with sky view through non-conductive bodywork.
    blocked_by: antenna connector on the carrier board; mounting position
    evidence: "docs/TELEMETRY_CANDIDATES.md#gnss-neo-m9n"
  - id: lte_modem
    item: LTE modem, if not included in the PCB assembly
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: SIMCom A7672 (board proposal); variant by region (A7672E, A7672SA, A7672S)
    in_assembly: null
    requirement: LTE Cat-1 bands of the event country's operator; MQTT client in the modem firmware.
    blocked_by: event country and operator; whether the PCB assembly includes it
    evidence: "docs/TELEMETRY_CANDIDATES.md#lte-a7672"
  - id: lte_antenna
    item: LTE antenna
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Covers the chosen variant's LTE bands; 50 ohm; one main antenna (the A7672X has no diversity input).
    blocked_by: modem variant, connector, mounting
    evidence: "docs/TELEMETRY_CANDIDATES.md#lte-a7672"
  - id: sim
    item: SIM card and data plan
    category: recurring
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Coverage at the event; about 0.5 to 7.7 MB per 40-minute attempt at 1 to 5 Hz (docs/COMBINED_ARCHITECTURE.md).
    blocked_by: event country, operator, modem variant
    evidence: "docs/TELEMETRY_CANDIDATES.md#lte-a7672"
  - id: dcdc
    item: Protected DC-DC power supply, if not included in the PCB assembly
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    in_assembly: null
    requirement: >-
      From the propulsion battery, downstream of the joulemeter (Articles 56d, 57b). Input rating from the maximum pack
      voltage with transients and margin, not from the 48 V nominal; modem supply 3.4-4.2 V with peaks up to 2 A
      at maximum 2G transmit power (A7672X Hardware Design V1.04 p. 26); fused (Article 57g).
    blocked_by: maximum pack voltage and transients (battery datasheet); whether the PCB assembly includes it
    evidence: "docs/BATTERY.md"
  - id: can_xcvr
    item: CAN transceiver/interface, if not included in the PCB assembly
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: null
    in_assembly: null
    requirement: Classic CAN 2.0B or CAN FD per the vehicle bus; 3.3 V logic for the STM32U575 FDCAN1. The Nucleo needs one for bench work too.
    blocked_by: vehicle bus type and bit rate (input sheet item 5); whether the PCB assembly includes it
    evidence: "docs/ICD.md"
  - id: harness
    item: Connectors and wiring
    category: vehicle
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: No splices; connections visible and accessible (Article 57k).
    blocked_by: harness plan and connector pinouts (input sheet item 11)
    evidence: "docs/RULES_COMPLIANCE.md"
  - id: display
    item: Driver display
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    candidate: "LED bar \"burn / coast\" (optional in the proposal), or an unmodified self-contained device"
    requirement: >-
      Power arrangement under Article 57i: a built-in battery only if the display is unmodified and self-contained;
      otherwise powered from the vehicle system through the joulemeter. A separate battery for a display is not an
      approved purchase.
    blocked_by: display type decision
    evidence: "docs/RULES_COMPLIANCE.md"
  - id: steering
    item: Optional steering-angle sensor
    category: vehicle
    qty: 1
    unit_cost_usd: null
    status: Blocked
    optional: true
    candidate: AS5600 (team reference), single-turn, needs a diametric magnet on the axis
    requirement: Measured angle range within one turn at the mounting point; magnet 0.5-3 mm air gap, axis displacement at most 0.25 mm (6 mm magnet).
    blocked_by: steering geometry (lock-to-lock angle at the mounting point, mounting)
    evidence: "docs/TELEMETRY_CANDIDATES.md#as5600"
  - id: shipping
    item: Shipping and tax on the lines above
    category: shipping_tax
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: From the supplier quotes.
    blocked_by: quotes
    evidence: null
  - id: contingency
    item: Contingency
    category: contingency
    qty: null
    unit_cost_usd: null
    status: Blocked
    candidate: null
    requirement: Not set; to be agreed with the team lead once lines are priced.
    blocked_by: priced lines and an agreed policy
    evidence: null
