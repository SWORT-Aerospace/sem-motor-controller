# Pricing evidence for the draft BOM (consumed by tools/price_bom.py).
#
# NOTHING HERE IS A QUOTE AND NOTHING HAS BEEN PURCHASED.
# No supplier quote has been obtained yet, so prices come from web-search result snapshots of
# distributor pages, retrieved 2026-10-15. Those snapshots are UNDATED caches:
# re-check every line on the live page before any order.
#
# evidence classes:
#   snippet         price seen in a search-result snapshot of a distributor page for this exact MPN
#   representative  the line is rating-dependent (UNRESOLVED); priced with a representative candidate's snippet
#                   price, which is NOT a selection
#   allowance       no quote obtained; engineering allowance range (stated, not sourced)
# Prices are USD per unit at quantity 1-10 unless noted; low/high bracket the evidence.

retrieved: "2026-10-15"
rules:
  # ---------------------------------------------------------------- ICs with an exact candidate MPN
  - match: {symbol: "MCU_ST_STM32G4:STM32G474VETx"}
    mpn: STM32G474VET6
    manufacturer: STMicroelectronics
    datasheet: "ST DS12288 (register row open: not read)"
    package: LQFP-100 14x14
    low: 11.62
    high: 12.13
    supplier: Mouser / Digi-Key
    evidence: snippet
    source: "Mouser 511-STM32G474VET6 cached $11.62@1; Digi-Key cached $12.13@1 (search 2026-10-15)"
    availability: "listed; DK TR variant showed backorder in one snapshot"
    alternate: "STM32G474VCT6 (same package, 256 KB flash): the image fits, but the current linker layout puts the calibration page at 0x0807F000, beyond its flash; needs its own layout, and its other differences are unchecked"
