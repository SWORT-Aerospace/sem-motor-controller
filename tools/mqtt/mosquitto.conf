# Local pit broker for host work (Mosquitto 2.0.x). Loopback only, no authentication:
# never expose this configuration on a network. Used by `docker compose -f tools/mqtt/compose.yaml up`
# and by a manual `mosquitto -c tools/mqtt/mosquitto.conf`. The tests and tools/run_mqtt_demo.py
# generate their own configuration on a free port (tools/mqtt_broker.py) and do not use this file.
listener 1883 127.0.0.1
allow_anonymous true
# keep subscriber sessions and queued messages across a broker restart
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
autosave_on_changes true
max_queued_messages 1000
log_dest stdout
connection_messages true
