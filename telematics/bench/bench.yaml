# First bench of the telematics firmware on a NUCLEO-U575ZI-Q: the single source of the bench procedure.
# tools/telematics_bench.py renders telematics/firmware/BENCH.md from this file and builds the bench package
# (images with their hashes, this procedure, the connection and parts lists, the commands and a blank results
# form). Nothing here has been run: every connection is unverified until a results form says otherwise.

title: "First bench: NUCLEO-U575ZI-Q telematics firmware"
power: >-
  USB only, from the PC through the board's ST-LINK port. Nothing on this bench is connected to the vehicle, its
  battery or the controller's bus. The vehicle power connection is blocked (docs/TELEMATICS_BOM.md, section
  Vehicle supply).
parts_config: bench            # hardware/telematics/bom.yaml lines with this config are the parts list
equipment: [usb_can, signal_gen, multimeter, scope, soldering]

images:
  - {name: tm_u575, files: [tm_u575.elf, tm_u575.bin, tm_u575.hex, tm_u575.map], steps: "B1 to B10, B12",
     what: "wheel capture, the log (NOR when it answers, else internal flash), IMU and TMP117, console"}
  - {name: tm_u575_can, files: [tm_u575_can.elf, tm_u575_can.bin, tm_u575_can.hex, tm_u575_can.map], steps: "B11",
     what: "the same plus FDCAN1 in bus-monitoring mode (sends nothing, not even the acknowledge bit)"}

sources: >-
  MCU pins: ST's open pin data and the firmware (each row names the line that sets the pin up). Arduino
  positions: Zephyr v4.4.2 boards/st/nucleo_u575zi_q/arduino_r3_connector.dtsi (A0 = PA3, A1 = PA2, D10 = PD14,
  D11 = PA7, D12 = PA6, D13 = PA5, D14 = PB9, D15 = PB8) and nucleo_u575zi_q.dts (console USART1 PA9/PA10,
  115200 8N1; LD1 PC7, LD2 PB7; LSE fitted, MSI PLL mode). The user manual UM2861, which gives the morpho and
  Zio positions, and the data sheet DS13737 were not readable from this environment: positions marked
  "locate" are found on the board and written on the results form before wiring.

connections:
  - {id: usb, signal: "Power, programming, console", mcu: "-", nucleo: "ST-LINK USB port", to: "PC", part: usb_cable,
     check: {file: telematics/firmware/platform/u575/uart_u575.c, contains: "board_gpio_af(GPIOA, 9u, 7u"},
     note: "USART1 PA9/PA10 reaches the PC as the ST-LINK virtual COM port, 115200 8N1"}
  - {id: leds, signal: "LD1 green, LD2 blue", mcu: "PC7, PB7", nucleo: "on board", to: "-",
     check: {file: telematics/firmware/platform/u575/board_u575.c, contains: "GPIOC->BSRR = on ? (1uL << 7)"},
     note: "LD1 toggles with each status line; LD2 is on while a block waits to be written or is being written"}
  - {id: wheel_0, signal: "wheel_0 (TIM2_CH4, AF1)", mcu: PA3, nucleo: "Arduino A0", to: "generator output (0 to 3.3 V square)",
     check: {file: telematics/firmware/platform/u575/board_u575.c, contains: "WHEEL_PIN[3] = {3u, 2u, 0u}"},
     note: "Internal pull-up on; falling edges counted. Never above 3.3 V: 5 V tolerance per pin is not in the sources read"}
  - {id: wheel_1, signal: "wheel_1 (TIM2_CH3, AF1)", mcu: PA2, nucleo: "Arduino A1", to: "B6: the same generator output as wheel_0",
     check: {file: telematics/firmware/platform/u575/board_u575.c, contains: "WHEEL_PIN[3] = {3u, 2u, 0u}"},
     note: "Open (unconnected) in the other steps: it then reads as suspect inactive (I) while wheel_0 turns, which is right"}
  - {id: wheel_2, signal: "wheel_2 (TIM2_CH1, AF1)", mcu: PA0, nucleo: "not needed (morpho or Zio)", to: "nothing (open)",
     check: {file: telematics/firmware/platform/u575/board_u575.c, contains: "WHEEL_PIN[3] = {3u, 2u, 0u}"},
     note: "Open in every step: its position is not needed"}
  - {id: gen_gnd, signal: "Generator ground", mcu: "-", nucleo: "GND (any)", to: "generator ground", note: "One ground"}
  - {id: nor_vcc, signal: "NOR VCC (pin 8)", mcu: "-", nucleo: "3V3", to: "W25Q128JV pin 8, 100 nF to pin 4", part: nor_chip,
     note: "SOIC-8 pins as the standard SPI NOR pinout (W25Q128JV data sheet, not read here: check pin 1 before soldering)"}
  - {id: nor_gnd, signal: "NOR GND (pin 4)", mcu: "-", nucleo: "GND", to: "W25Q128JV pin 4", part: nor_chip}
  - {id: nor_cs, signal: "NOR /CS (pin 1)", mcu: PD14, nucleo: "Arduino D10", to: "W25Q128JV pin 1, 10 kOhm to 3V3", part: nor_chip,
     check: {file: telematics/firmware/platform/u575/spi_u575.c, contains: "(14u + 16u)"},
     note: "The 10 kOhm keeps the NOR deselected while the MCU resets"}
  - {id: nor_miso, signal: "NOR DO (pin 2)", mcu: PA6, nucleo: "Arduino D12", to: "W25Q128JV pin 2", part: nor_chip,
     check: {file: telematics/firmware/platform/u575/spi_u575.c, contains: "board_gpio_af(GPIOA, 6u, 5u, true"},
     note: "MCU pull-up on: with no NOR selected the JEDEC read is ff ff ff and the firmware uses internal flash"}
  - {id: nor_mosi, signal: "NOR DI (pin 5)", mcu: PA7, nucleo: "Arduino D11", to: "W25Q128JV pin 5", part: nor_chip,
     check: {file: telematics/firmware/platform/u575/spi_u575.c, contains: "board_gpio_af(GPIOA, 7u, 5u"}}
  - {id: nor_sck, signal: "NOR CLK (pin 6)", mcu: PA5, nucleo: "Arduino D13", to: "W25Q128JV pin 6", part: nor_chip,
     check: {file: telematics/firmware/platform/u575/spi_u575.c, contains: "board_gpio_af(GPIOA, 5u, 5u"}}
  - {id: nor_wp_hold, signal: "NOR /WP (pin 3) and /HOLD (pin 7)", mcu: "-", nucleo: "3V3", to: "W25Q128JV pins 3 and 7",
     part: nor_chip, note: "Standard SPI only: both tied high"}
  - {id: i2c_scl, signal: "I2C1 SCL", mcu: PB8, nucleo: "Arduino D15", to: "Qwiic yellow (SCL) of the IMU's breadboard cable", part: imu,
     check: {file: telematics/firmware/platform/u575/i2c_u575.c, contains: "board_gpio_af(GPIOB, 8u, 4u, false, true)"},
     note: "Open drain; the breakouts carry the pull-ups"}
  - {id: i2c_sda, signal: "I2C1 SDA", mcu: PB9, nucleo: "Arduino D14", to: "Qwiic blue (SDA)", part: imu,
     check: {file: telematics/firmware/platform/u575/i2c_u575.c, contains: "board_gpio_af(GPIOB, 9u, 4u, false, true)"}}
  - {id: i2c_power, signal: "Qwiic 3.3 V and GND", mcu: "-", nucleo: "3V3, GND", to: "Qwiic red (3.3 V), black (GND)", part: imu,
     note: "3.3 V only; the breakouts carry the I2C pull-ups"}
  - {id: tmp117, signal: "TMP117 on I2C1", mcu: "-", nucleo: "-", to: "the IMU breakout's second Qwiic connector (qwiic_cable)",
     part: tmp117, check: {file: telematics/firmware/platform/u575/main_u575.c, contains: "0x48u; a <= 0x4Bu"},
     note: "Any address 0x48 to 0x4B is probed; the banner names the one found"}
  - {id: can_rx, signal: "CAN RX (FDCAN1_RX, AF9)", mcu: PD0, nucleo: "locate (Zio, morpho or the CAN FD header; UM2861)", to: "CAN Pal RX", part: can_xcvr,
     check: {file: telematics/firmware/platform/u575/can_u575.c, contains: "board_gpio_af(GPIOD, 0u, 9u"},
     note: "B11 and E1 only (tm_u575_can)"}
  - {id: can_tx, signal: "CAN TX (FDCAN1_TX, AF9)", mcu: PD1, nucleo: "locate (Zio, morpho or the CAN FD header; UM2861)", to: "CAN Pal TX", part: can_xcvr,
     check: {file: telematics/firmware/platform/u575/can_u575.c, contains: "board_gpio_af(GPIOD, 1u, 9u"},
     note: "Bus-monitoring mode keeps it recessive; the silent pin below disables the transmitter in hardware"}
  - {id: can_slnt, signal: "CAN Pal SLNT", mcu: "-", nucleo: "3V3", to: "CAN Pal SLNT", part: can_xcvr,
     note: "High = TJA1051 silent mode: transmitter off whatever TX does (Adafruit CAN Pal pinout guide)"}
  - {id: can_power, signal: "CAN Pal supply and logic level", mcu: "-", nucleo: "3V3, GND", to: "CAN Pal supply, VIO and GND pins",
     part: can_xcvr, note: "3.3 V only: the CAN Pal's charge pump makes the transceiver's 5 V, VIO at 3.3 V sets the logic level (Adafruit product page). No 5 V wire. Read the pin labels off the CAN Pal's silkscreen and write them on the form"}

parts_without_a_row:          # bench BOM lines that are not the "part" of a connection row, and what each is for
  mcu: "the NUCLEO-U575ZI-Q itself"
  nor_adapter: "the W25Q128JV soldered onto it (rows nor_*), on the breadboard"
  nor_passives: "100 nF across NOR pins 8 and 4; 10 kOhm from /CS to 3V3; 120 Ohm at the adapter end of the B11 bench bus"
  headers: "soldered to the NOR adapter"
  qwiic_jumper: "rows i2c_* (the IMU's first Qwiic connector to the NUCLEO's pins)"
  qwiic_cable: "row tmp117"
  breadboard: "holds the NOR adapter and the CAN Pal"
  jumpers: "wires into the NUCLEO's female Arduino/Zio headers; the B6 jumper to GND; the E1 jumpers"
  jumpers_fm: "wires to the male ST morpho pins, if PD0/PD1 are found only there"

board_notes:
  - "Pins left alone because the board uses them (ST open pin data): PA11/PA12 USB, PA15 UCPD1_CC1, PB3 SWO, PB5 UCPD. Port G needs VDDIO2 and is not used."
  - "Console: USART1 from the 4 MHz MSIS, BRR 35: 114286 baud, 0.8 % below 115200, inside the usual UART tolerance (not measured)."
  - "LSE: if it does not start, the clock line says so and the CAN image reports CAN off (the bit timing needs the LSE-locked clock)."

commands:
  build_host: |-
    cmake -S telematics/firmware -B build-telematics -G Ninja
    cmake --build build-telematics && ctest --test-dir build-telematics --output-on-failure
  build_target: |-
    cmake -S telematics/firmware -B build-u575 -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCMAKE_TOOLCHAIN_FILE=$PWD/telematics/firmware/cmake/arm-none-eabi-cortex-m33.cmake -DTM_TARGET_U575=ON
    cmake --build build-u575
  package: "python3 tools/telematics_bench.py package --images build-u575 --out build/telematics_bench --rebuild"
  verify: "sha256sum tm_u575.bin tm_u575_can.bin     # must equal MANIFEST.json"
  flash_cubeprogrammer: "STM32_Programmer_CLI -c port=SWD -w tm_u575.bin 0x08000000 -v -rst"
  flash_openocd: "openocd -f interface/stlink.cfg -f target/stm32u5x.cfg -c \"program tm_u575.elf verify reset exit\""
  console: "python3 tools/uart_capture.py /dev/ttyACM0 capture_B<n>.txt     # or: picocom -b 115200 --logfile capture_B<n>.txt /dev/ttyACM0"
  export_uart: "in the terminal: DUMP (every used slot) or DUMP <first> <last> (those slots and their session header)"
  export_programmer: "STM32_Programmer_CLI -c port=SWD -r 0x08100000 0x100000 dump.bin     # internal flash only (the NOR is not memory-mapped)"
  import: "python3 tools/telematics_import.py --uart-capture capture_B<n>.txt --db bench.sqlite --out bench/B<n> --wheel-circumference <m> --wheel-ppr 1 --source \"bench B<n>: generator\""
  status: "python3 tools/telematics_import.py --status-capture capture_B<n>.txt --out bench/B<n>"
  chain: "python3 tools/run_bench_chain.py --uart-capture capture_B<n>.txt --pulse-hz <Hz> --circumference <m> --ppr 1 --out bench/B<n>_chain"
  query: "python3 tools/pit_query.py --db bench/B<n>_chain/pit.sqlite gaps --run <run_id> --signal wheel.wheel_0.speed"
  never: "Do not mass-erase: on internal storage that also erases the log. ERASE YES on the console clears the log on purpose."

steps:
  - id: B0
    title: Preflight, unpowered
    do: >-
      Wire every row of the connection table except can_* (the CAN Pal is added in B11); the IMU and TMP117 stay
      connected from here on. Board unplugged. Check every row of the connection table with the multimeter's continuity test and write the
      position of each "locate" pin on the form. Check that nothing above 3.3 V can reach an MCU pin and that 3V3
      and 5V are not shorted to GND. Check the image hashes against MANIFEST.json (commands.verify).
    expect: "continuity on every row; no short; hashes equal"
    record: [positions of PD0 and PD1, CAN Pal pin labels, continuity per row, hash of tm_u575.bin, hash of tm_u575_can.bin]
  - id: B1
    title: Flash and start
    do: "Flash tm_u575.bin (commands.flash_*), open the console with capture (commands.console)."
    expect: >-
      Banner: "telematics tm_u575 <revision>" with the revision in MANIFEST.json (not ending in -dirty), "boot=1",
      "clock: TIM2 1 MHz from MSIS 4 MHz, PLL mode on the LSE (LSE accuracy)" (if the LSE starts), "log: W25Q NOR on
      SPI1 (JEDEC ef 40 18, 16384 KiB, 4096 slots), slot 0 of 4096", "IMU: ISM330DHCX, TMP117: 0x48", "chip: rev 0x...., fault record ..."; then one
      status line per second ("TM t=... tov=0 ... wheel=NNN ... log=full ..."); LD1 toggling every second.
    record: [banner text, LSE started yes/no, storage line, IMU and TMP117 line, silicon revision and fault-record line (for the errata and the SRAM_RST option)]
    firmware_text:
      - {file: telematics/firmware/platform/u575/main_u575.c, contains: "PLL mode on the LSE (LSE accuracy)"}
      - {file: telematics/firmware/platform/u575/main_u575.c, contains: "W25Q NOR on SPI1 (JEDEC %02x %02x %02x, %lu KiB, %lu slots)"}
      - {file: telematics/firmware/platform/u575/main_u575.c, contains: "IMU: %s, TMP117: %s"}
      - {file: telematics/firmware/platform/u575/main_u575.c, contains: "chip: rev 0x%04x, fault record %s"}
      - {file: telematics/firmware/src/tm_app.c, contains: "slots=%lu/%lu log=%s left=%ss thin=%lu"}
  - id: B2
    title: Restarts
    do: "Press the reset button twice."
    expect: "boot=2, then boot=3; the reset cause of each (PIN expected for the button)"
    record: [the three reset causes]
  - id: B3
    title: One wheel channel at 100 Hz
    do: "100.0 Hz square wave, 0 to 3.3 V, into wheel_0 (PA3) for 60 s, then stop. Keep capturing."
    expect: >-
      edges= of wheel_0 rising by 100 per status line (plus or minus 1); within about 1 s "wheel=MII" (wheel_1 and
      wheel_2 are open: suspect inactive, as a disconnected sensor must read); after the stop "wheel=SNN".
    record: [generator model and its frequency accuracy, edges per second, wheel states]
    firmware_text:
      - {file: telematics/firmware/include/tm_wheel.h, contains: "TM_WHEEL_SUSPECT_INACTIVE = 'I'"}
  - id: B4
    title: Read the log back and import
    do: >-
      DUMP on the console (still capturing), then commands.import with --wheel-circumference 0.1 (0.1 m per edge:
      100 Hz reads 10.0 m/s, inside the 0 to 60 m/s plausibility range).
    expect: >-
      wheel_0 speed 10.000 m/s while the generator ran, the deviation within the generator's accuracy plus 0.1 %
      (PROVISIONAL: 1 us capture over 100 ms is 10 ppm; the LSE-trimmed timebase is expected at ppm level, the
      untrimmed MSI is not characterised here); distance = edges x 0.1 m; after the stop "no_evidence", never 0;
      wheel_1 and wheel_2 speed "invalid" ("suspect: ... disconnected") while wheel_0 ran.
    record: [mean speed and its deviation, distance against edges, validity counts per channel, the speed plot,
             the commands.chain result (C2 and C5 to C7 with --pulse-hz 100 --circumference 0.1) and the commands.query
             listing (the stop shows as UNKNOWN, never as 0)]
  - id: B5
    title: Rates
    do: "1 Hz, 10 Hz, 1 kHz and 5 kHz into wheel_0, 20 s each; import with --wheel-circumference 0.01 (1 kHz reads 10 m/s)."
    expect: "edges exactly 20 x the rate (plus or minus 1) at each; lost=0 at 1 Hz to 1 kHz"
    record: [edge counts per rate, the rate at which lost= first rises, if any]
  - id: B6
    title: Stuck and disconnected sensor against a moving wheel
    do: >-
      Feed the 10 Hz square wave to wheel_0 and wheel_1 together. (a) Pull wheel_1's lead off the generator
      for 5 s (the pull-up holds the line high), then reconnect it. (b) Pull the lead off again and jumper wheel_1
      to GND for 5 s (stuck low: a short or a failed sensor; never jumper a line the generator drives), then remove
      the jumper and reconnect the lead. (c) Pull the lead off, jumper wheel_1 to GND, and stop the generator for
      10 s.
    expect: >-
      Both turning: "wheel=MMI" (wheel_2 open). (a) within about 1 s "wheel=MII", COUNTERS2 wheel_suspect_inactive +1, back to MMI
      on reconnection. (b) within about 1 s "wheel=MAI", wheel_suspect_active +1. (c) "wheel=SSN": a held line is
      not standstill. Import (--wheel-circumference 0.1): wheel_1 speed "invalid" with "stuck inactive or
      disconnected" in (a) and "stuck active" in (b), "no_evidence" in (c); no speed of 0 anywhere; wheel_1's
      distance a lower bound after (a).
    record: [status line at each change, the import's validity per interval, the two counters]
    firmware_text:
      - {file: host/telematics/wheel.py, contains: "stuck inactive or "}
      - {file: host/telematics/wheel.py, contains: "(stuck active: short to "}
      - {file: host/telematics/stlg.py, contains: "wheel_suspect_inactive"}
      - {file: host/telematics/stlg.py, contains: "wheel_suspect_active"}
  - id: B7
    title: 75 minutes across the 32-bit timer overflow
    do: >-
      With the NOR fitted (banner shows it), press reset (the 32-bit timer starts at 0), 1 kHz into wheel_0 for
      75 min, capturing the console to one file. Then commands.status on the capture. It prints the slots= value
      n on the status line where tov= changes from 0 to 1 ([[overflow_s]] s after the reset); DUMP n-15 n+15 and
      import that capture with --wheel-circumference 0.01. A full DUMP is not needed (at 115200 baud a slot takes
      about 0.7 s to print).
    expect: >-
      Status check PASS: t= continuous, tov 0 to 1 once, [[overflow_s]] s after the reset, the edge rate steady at
      1000 Hz on both sides. Log: wheel_0 speed 10.00 m/s in every record, including the one that spans the
      overflow; no record time jumps. left= after 2 min about [[imu_nor_full_s]] s with the IMU and TMP117 connected ([[wheel_nor_full_s]] s
      without), less the time earlier steps used: over the 4500 s of the step either way. Without the NOR (internal flash only) the log switches to sparse logging after
      about [[imu_internal_full_min]] min ([[wheel_internal_full_min]] min without the IMU and TMP117) and still holds the overflow, in records [[sparse_period_s]] s apart
      (docs/generated/telematics_storage.md).
    record: [status check output, the slot n at the overflow, speed around 4295 s, left= after 2 min]
    firmware_text:
      - {file: tools/telematics_import.py, contains: "DUMP {max(0, c['slot'] - 15)} {c['slot'] + 15}"}
  - id: B8
    title: Power cut during a write
    do: "100 Hz into wheel_0. Pull the USB cable while LD2 is on (a block waiting or being written); reconnect; DUMP and import."
    expect: "the next boot number and a power-related reset cause; at most one corrupt slot counted; nothing else lost before the last counters record"
    record: [reset cause, the import's corrupt-slot count and accounting]
  - id: B9
    title: Internal flash fills; sparse logging
    do: >-
      Pull the /CS wire off D10 (the 10 kOhm keeps the NOR deselected; its VCC stays connected, since an
      unpowered NOR can be fed through its driven inputs), reset, feed 100 Hz into wheel_0 with the IMU and TMP117
      connected, and watch the status line.
    expect: >-
      Banner "log: internal flash bank 2 (0x08100000, 1 MiB, 256 slots): no W25Q NOR of 1 to 16 MiB answered". log=full, then
      log=sparse after about [[imu_internal_full_min]] min ([[wheel_internal_full_min]] min without the IMU and TMP117), less if the internal log already holds
      sessions; thin= rising; an EVENT record (code 2) in the log.
    record: [time of the switch, thin= rate]
    firmware_text:
      - {file: telematics/firmware/platform/u575/main_u575.c, contains: "internal flash bank 2 (0x08100000, 1 MiB, 256 slots): no W25Q NOR of 1 to 16 MiB answered"}
      - {file: telematics/firmware/src/tm_app.c, contains: "sparse logging: storage reserve reached"}
  - id: B10
    title: Erase
    do: "Put the /CS wire back on D10, reset, then ERASE YES."
    expect: "ERASING ..., a chip erase (up to a few minutes), restart, \"slot 0 of 4096\""
    record: [erase time]
    firmware_text:
      - {file: telematics/firmware/platform/u575/main_u575.c, contains: "ERASING the log storage, then restarting"}
  - id: B11
    title: CAN receive, receive-only
    do: >-
      Board unplugged: wire the can_* rows. Bench bus: two jumper wires on the breadboard from the CAN Pal's CANH
      and CANL terminals to the first USB-CAN adapter; CAN Pal termination switch on (one end), the 120 Ohm across
      CANH-CANL at the adapter (the other end; adapter termination off); the multimeter reads about 60 Ohm across
      CANH-CANL unpowered. Flash tm_u575_can.bin. First the adapter alone sending 8-byte classic frames at 500
      kbit/s; then add the second adapter, in normal (acknowledging) mode, on the same two wires.
    expect: >-
      Banner "CAN: on (bus monitoring, 500 kbit/s classic)". Adapter alone: every frame ends in an acknowledge error
      at the adapter (nobody acknowledges: the board sends no acknowledge bit). With the second adapter: can= counts
      every frame and no frame from the board appears on the bus. The board's TX line stays high on the scope.
    record: [frame counts on every node, adapter error counters, scope trace of TX]
    firmware_text:
      - {file: telematics/firmware/platform/u575/can_u575.c, contains: "on (bus monitoring, 500 kbit/s classic)"}
  - id: B12
    title: IMU and temperature
    do: "tm_u575.bin with the IMU and TMP117 connected; 60 s at rest; DUMP and import."
    expect: "IMU records at about 100 Hz; TMP117 at 1 Hz within the sensor's accuracy of a reference thermometer"
    record: [IMU axes against the board orientation, temperature against the reference]

electrical:
  intro: >-
    Before the unit goes near the controller team's bus (docs/CONTROLLER_INTERFACE_REQUEST.md section 5). Receive-only
    firmware does not by itself prove that the unit cannot disturb the bus; these checks are about the hardware.
    Legitimate traffic drives the shared bus dominant, so no check asks the bus to stay recessive while others send:
    each one tests what our node itself does.
  checks:
    - id: E1
      title: Our transmitter is disabled in hardware
      method: >-
        (a) Isolated bus, no other node: CAN Pal alone on a bench bus terminated at both ends (about 60 ohm), SLNT
        high, powered from the running board. Take the TX wire off PD1 (never short a driven MCU output) and force
        the CAN Pal's TX input low with a jumper to GND, then high to 3V3. Then, as a control, SLNT low with TX low.
        Put the TX wire back on PD1. (b) With traffic: one USB-CAN adapter sending frames that only our node could
        acknowledge. (c) A second, acknowledging adapter added.
      pass: >-
        (a) With SLNT high, CANH-CANL stays recessive (below 0.5 V) whatever TX does; with SLNT low and TX low it goes
        dominant (the control shows the measurement can see a dominant level). (b) Every frame ends in an
        acknowledge error at the sender, and the board's TX stays high: no dominant bit comes from our node. (c) The
        adapters' error counters do not change between 10,000 frames with and 10,000 without our node connected.
    - id: E2
      title: Unpowered behaviour
      method: "unit unpowered, bus active with two acknowledging nodes"
      pass: "no change in the bus's error counters or waveform; the transceiver's unpowered leakage within its data sheet figure"
    - id: E3
      title: Termination
      method: "CANH-CANL resistance with the bus unpowered, with and without the unit"
      pass: "the unit adds no termination (the CAN Pal's switch off) unless the interface agreement asks for it; about 60 ohm for a bus terminated at both ends"
    - id: E4
      title: Bus loading
      method: "the unit's input capacitance (transceiver data sheet) and its stub length"
      pass: "stub within the limit agreed with the controller team for their bit rate"
    - id: E5
      title: Ground
      method: "the unit's ground reference to the controller's CAN ground"
      pass: "one ground connection at the agreed point; no ground loop through a USB-connected PC on the vehicle"
    - id: E6
      title: Supply
      method: "the unit's own supply"
      pass: "blocked: no vehicle supply until V_bat,max is known and the supply parts are selected (docs/TELEMATICS_BOM.md); the unit never takes power from the controller's connector"

# ------------------------------------------------------------------------------------------------- minimal bench
# The first physical chain and nothing else: signal source -> STM32U575 input capture (TIM2) -> timestamp and
# evidence state -> persistent log in internal flash bank 2 -> power cycle -> export (console DUMP) -> host decoder
# -> SQLite -> shadow evidence review -> receipt -> speed and distance plot. No NOR, IMU, TMP117 or CAN: those are
# the full bench above. `tools/telematics_bench.py package --minimal` builds its own package from this section and
# `render` writes telematics/firmware/BENCH_MINIMAL.md. Nothing here has been run on a board.
minimal:
  title: "Minimal bench: one wheel input to a plot (NUCLEO-U575ZI-Q on USB power)"
  chain: >-
    signal generator (stands in for a Hall sensor) -> PA3, TIM2_CH4 input capture -> WHEEL_EDGES record with its
    timestamps and validity -> internal flash bank 2 -> USB power cycle -> console DUMP -> tools/telematics_import.py
    (STLG decoder) -> SQLite pit database -> shadow evidence review -> receipts -> speed and distance plot
  image: tm_u575
  connections: [usb, leds, wheel_0, wheel_1, wheel_2, gen_gnd]
  open: [wheel_1, wheel_2]          # unconnected here: each reads as suspect inactive (I) while wheel_0 turns
  parts: [mcu, usb_cable, jumpers]
  equipment: [signal_gen, multimeter, scope]
  equipment_use:
    signal_gen: "the wheel_0 pulses: 100.000 Hz square wave, 0 to 3.3 V (stands in for a Hall sensor)"
    multimeter: "continuity of the two signal wires before power (M0)"
    scope: "the generator's levels and frequency into nothing, before it is connected (M0)"
  commands:
    verify: "sha256sum tm_u575.bin     # must equal MANIFEST.json"
    console_first: "python3 tools/uart_capture.py /dev/ttyACM0 capture_M1.txt"
    console_after_cycle: "python3 tools/uart_capture.py /dev/ttyACM0 capture_M3.txt"
    chain: "python3 tools/run_bench_chain.py --uart-capture capture_M3.txt --pulse-hz 100 --circumference 0.1 --ppr 1 --boot 1 --out bench/M_chain"
    gaps: "python3 tools/pit_query.py --db bench/M_chain/pit.sqlite gaps --run <run_id> --signal wheel.wheel_0.speed"
    status: "python3 tools/telematics_import.py --status-capture capture_M1.txt --out bench/M_status"
    rehearse: "python3 tools/run_bench_chain.py --rehearse-minimal --out bench/M_rehearsal     # host simulation, SIMULATED"
  steps:
    - id: M0
      title: Document checks and preflight, unpowered
      do: >-
        Answer every document check due before M0 or M1 (DOCUMENT_CHECKS.md, last column), each with the
        document's revision and page; if an answer contradicts the firmware line the check names, stop and do not
        flash. Check the image hash (minimal.verify). Board unplugged. Generator output off; set a 100.000 Hz
        square wave, low level 0 V, high level 3.3 V (high-impedance load setting; many generators start at a
        symmetric amplitude around 0 V, which would drive the pin below ground); enable the output into nothing,
        check low, high and frequency on the scope, then turn the output off again. Wire the generator's signal to
        Arduino A0 (PA3) and its ground to a NUCLEO GND pin; nothing on A1 or PA0. Check both wires for continuity.
      expect: "every check before M0 and M1 answered, none contradicting the firmware; hash equal; low between -0.1 and 0.1 V, high between 3.0 and 3.3 V, 100.0 Hz; continuity on both wires"
      record: [document revision and page per check, SHA-256 of tm_u575.bin, generator model and frequency accuracy, scope low and high levels and frequency, continuity of A0 and GND wires]
    - id: M1
      title: Flash and start without input
      do: >-
        Generator output still off. USB cable from the PC to the ST-LINK port. Flash tm_u575.bin
        (commands.flash_cubeprogrammer or commands.flash_openocd), then open the console with capture
        (minimal.console_first). Do not halt the core with a debugger: the watchdog resets the board after about
        2 s. If the log line does not say slot 0 on this first start (bank 2 held something else) or says PAUSED,
        type ERASE YES, let it restart, and record that.
      expect: >-
        Banner: "telematics tm_u575 <revision>" with the MANIFEST revision (not ending in -dirty), "boot=1", a clock
        line ("PLL mode on the LSE (LSE accuracy)" if the LSE starts), "log: internal flash bank 2 (0x08100000, 1
        MiB, 256 slots): no W25Q NOR of 1 to 16 MiB answered, slot 0 of 256", "CAN: off (not in this image)",
        "IMU: none, TMP117: none", "chip: rev 0x...., fault record ..."; then one status line per second with
        "wheel=NNN" and "edges=0/0/0"; LD1 toggling.
      record: [banner text, LSE started yes or no, the reset cause, silicon revision and fault-record line, ERASE YES needed yes or no]
      firmware_text:
        - {file: telematics/firmware/platform/u575/main_u575.c, contains: "internal flash bank 2 (0x08100000, 1 MiB, 256 slots): no W25Q NOR of 1 to 16 MiB answered"}
        - {file: telematics/firmware/platform/u575/main_u575.c, contains: "IMU: %s, TMP117: %s"}
        - {file: telematics/firmware/platform/u575/main_u575.c, contains: "chip: rev 0x%04x, fault record %s"}
        - {file: telematics/firmware/platform/u575/main_u575.c, contains: "off (not in this image)"}
        - {file: telematics/firmware/src/tm_app.c, contains: "edges=%lu/%lu/%lu wheel=%c%c%c"}
    - id: M2
      title: Pulses into the log
      do: >-
        After at least 5 status lines without input: generator output on (100.000 Hz into wheel_0) for 60 s by
        the status line's t=, then output off. Keep capturing for at least 10 s more, until LD2 has stayed off for
        5 s (a partly filled block is written within 2 s).
      expect: >-
        The first edges= value rising by 100 per status line (plus or minus 1) while the generator runs; within
        about 1 s "wheel=MII" (A1 and PA0 are open: suspect inactive, as a disconnected sensor must read);
        "lost=0"; after the stop "wheel=SNN"; LD2 flashing while blocks are written.
      record: [t= at the start and at the stop, edges per status line, wheel states before during and after, lost=]
      firmware_text:
        - {file: telematics/firmware/include/tm_wheel.h, contains: "TM_WHEEL_SUSPECT_INACTIVE = 'I'"}
        - {file: telematics/firmware/include/tm_config.h, contains: "TM_BLOCK_FLUSH_US 2000000u"}
    - id: M3
      title: Power cycle, then export
      do: >-
        Generator output stays off. Unplug the USB cable for 10 s and plug it back in: the board restarts on USB
        power. Open the console again with capture (minimal.console_after_cycle) and type DUMP; wait for "DUMP
        END". Keep capture_M1.txt and capture_M3.txt unchanged.
      expect: >-
        Banner "boot=2" with a power-on or brown-out reset cause and "slot n of 256" with n above 0: the M2 session
        survived the power cycle in internal flash. "DUMP BEGIN 256", one "S <slot> <hex>" line per used slot,
        "DUMP END".
      record: [the reset cause after the power cycle, slot n in the banner, number of S lines, time the DUMP took]
      firmware_text:
        - {file: telematics/firmware/platform/u575/main_u575.c, contains: "DUMP BEGIN %lu"}
        - {file: telematics/firmware/platform/u575/main_u575.c, contains: "DUMP END"}
    - id: M4
      title: Decoder, database, review, receipt, plot
      do: >-
        On the PC: minimal.chain (boot 1 is the M2 session), then minimal.gaps with the run id the chain printed,
        and minimal.status on capture_M1.txt. Keep the whole bench/M_chain folder.
      expect: >-
        BENCH CHAIN PASS with data class BENCH (from the log's own kind, never assumed): C2 median VALID speed
        within 0.2 % of 10.00 m/s (100 Hz x 0.1 m; the M1 clock line says whether the timebase was LSE-trimmed); C3 no speed of 0 and every sample
        without edges UNKNOWN, with an upper bound after the first edge; C4 distance equal to the log's edge total
        x 0.1 m, about 600 m; C5 to C7; C8 receipts stored, complete, advisory, nothing established, timing policy
        "assumed timestamp bounds not accepted"; C9 the speed and distance plot. The gaps listing shows the time
        before the first pulse and after the stop as not admissible, never as 0.
      record: [run id, every chain check with its detail, edge total and distance, the gaps listing, the plot file, chain.json SHA-256]
      firmware_text:
        - {file: tools/run_bench_chain.py, contains: "C8 shadow review: receipts stored, complete, advisory, nothing established"}
        - {file: tools/run_bench_chain.py, contains: "C9 speed and distance plot written from the database"}
        - {file: host/assurance/review.py, contains: "assumed timestamp bounds not accepted: only measured or documented bounds count"}
  needs_a_board:
    - "Every connection row: no pin, header position, solder bridge or level has been checked on a NUCLEO-U575ZI-Q."
    - "That the image starts at all: clock tree, flash wait states after reset, vector table, watchdog, USART1 at 114,286 baud through the ST-LINK virtual COM port."
    - "TIM2 input capture on PA3: the AF1 mapping, the 2 us input filter, falling-edge capture, CC4IF clearing and overcapture, the 32-bit timebase rate (MSIS, LSE-trimmed or not)."
    - "Internal flash bank 2: unlock, page erase, quad-word programming, ECC on read; that the log survives a power cycle."
    - "The DUMP export over the virtual COM port and its duration."
    - "The speed accuracy against the generator (only the host simulation has been run: SIMULATED)."
    - "The chain's checks on a real capture: the rehearsal in this package runs the same commands on host-simulated data."

# Primary documents the checks below need. None is in the repository and the manufacturers' sites are refused by
# this environment's network policy (T-U5-DOCS): commit each PDF to docs/reference/datasheets/ under `file`.
documents:
  - {id: RM0456, file: st-rm0456-stm32u5.pdf, part: "STM32U575ZIT6Q (on the NUCLEO-U575ZI-Q)", maker: STMicroelectronics,
     title: "RM0456, STM32U5 series reference manual (latest revision)",
     page: "https://www.st.com/en/microcontrollers-microprocessors/stm32u575zi.html (documentation tab; unverified)"}
  - {id: DS13737, file: st-ds13737-stm32u575.pdf, part: STM32U575ZIT6Q, maker: STMicroelectronics,
     title: "DS13737, STM32U575xx data sheet (latest revision)",
     page: "https://www.st.com/en/microcontrollers-microprocessors/stm32u575zi.html (unverified)"}
  - {id: ES0499, file: st-es0499-stm32u575-errata.pdf, part: "STM32U575xx and STM32U585xx, every silicon revision", maker: STMicroelectronics,
     title: "ES0499, STM32U575xx and STM32U585xx device errata (latest revision)",
     page: "https://www.st.com/en/microcontrollers-microprocessors/stm32u575zi.html (unverified)"}
  - {id: UM2861, file: st-um2861-nucleo-u575zi-q.pdf, part: "NUCLEO-U575ZI-Q (MB1549)", maker: STMicroelectronics,
     title: "UM2861, STM32U5 Nucleo-144 board (MB1549) user manual (latest revision)",
     page: "https://www.st.com/en/evaluation-tools/nucleo-u575zi-q.html (unverified)"}
  - {id: W25Q128JV, file: winbond-w25q128jv.pdf, part: "W25Q128JVSIQ (SOIC-8 208 mil)", maker: Winbond,
     title: "W25Q128JV 3V 128M-bit serial flash memory data sheet (latest revision)",
     page: "https://www.winbond.com/hq/product/code-storage-flash-memory/serial-nor-flash/ (unverified)"}

# Each check: the question, the document that answers it, the firmware line that depends on the answer (checked
# by `render --check`), and the step it must be answered before. before M0 or M1: the minimal bench; B0, B7, B11,
# B12: the full bench (NOR, CAN, I2C).
document_checks:
  - {id: DC01, doc: UM2861, before: M0, question: "Arduino A0 is PA3 and a GND pin is next to the headers; the ST-LINK virtual COM port reaches USART1 PA9/PA10 with the default solder bridges; the ST-LINK USB connector type and that it powers the board by default (5V_STLK); the 32.768 kHz LSE crystal is fitted and connected by default.",
     code: {file: telematics/firmware/platform/u575/uart_u575.c, contains: "board_gpio_af(GPIOA, 9u, 7u"}}
  - {id: DC02, doc: DS13737, before: M0, question: "PA3 (and PA2, PA0): I/O structure (FT or TT), absolute maximum input voltage with VDD at 3.3 V and with the board unpowered, VIL and VIH, the input hysteresis, and the internal pull-up range (RPU), which the 0 to 3.3 V generator levels and the open-collector sensor rely on.",
     code: {file: telematics/firmware/platform/u575/board_u575.c, contains: "board_gpio_af(GPIOA, WHEEL_PIN[i], 1u, true, false)"}}
  - {id: DC03, doc: DS13737, before: M1, question: "Alternate function table: AF1 on PA3 is TIM2_CH4 (PA2 TIM2_CH3, PA0 TIM2_CH1); AF7 on PA9/PA10 is USART1_TX/RX.",
     code: {file: telematics/firmware/platform/u575/board_u575.c, contains: "WHEEL_PIN[3] = {3u, 2u, 0u}"}}
  - {id: DC04, doc: RM0456, before: M1, question: "RCC after reset: MSIS at 4 MHz, AHB and APB prescalers 1, RCC_CCIPR1 USART1SEL selecting PCLK2; MSI PLL mode needs LSESYSEN and LSESYSRDY (D1), and which LSE drive level and MSIS range PLL mode allows.",
     code: {file: telematics/firmware/platform/u575/board_u575.c, contains: "RCC->BDCR |= RCC_BDCR_LSESYSEN"}}
  - {id: DC05, doc: RM0456, before: M1, question: "TIM2: a 32-bit counter; ICxF = 0011 is 8 samples at the timer clock (2 us at 4 MHz); CCxP = 1, CCxNP = 0 captures falling edges; CCxIF is cleared by reading CCRx and CCxOF flags a lost capture; with URS = 1 only an overflow sets UIF; the PSC is loaded by UG.",
     code: {file: telematics/firmware/platform/u575/board_u575.c, contains: "TIM2->CR1 = TIM_CR1_URS;"}}
  - {id: DC06, doc: RM0456, before: M1, question: "Embedded flash on the 2 MB part: two banks of 128 pages of 8 KiB, bank 2 at 0x08100000 when SWAP_BANK = 0; the non-secure unlock keys 0x45670123 then 0xCDEF89AB in NSKEYR; page erase with BKER, PNB and PER then STRT; quad-word programming (PG, four 32-bit writes to a 16-byte aligned address, interrupts off between them); BSY and WDW; the error flags and how they clear; whether a read of bank 2 while bank 2 is busy stalls or faults.",
     code: {file: telematics/firmware/platform/u575/flash_u575.c, contains: "#define KEY1 0x45670123u"}}
  - {id: DC07, doc: RM0456, before: M1, question: "FLASH_ECCR: ECCD raises an NMI on a double error; units of ADDR_ECC and the meaning of BK_ECC; clearing ECCD by writing 1. The log reads a slot that a power cut may have left half programmed.",
     code: {file: telematics/firmware/platform/u575/flash_u575.c, contains: "FLASH_ECCR_BK_ECC"}}
  - {id: DC08, doc: RM0456, before: M1, question: "Option bytes and their factory values: SWAP_BANK, IWDG_SW, SRAM_RST, and any dual-bank option of the 2 MB part; with SWAP_BANK = 1, whether BKER names the physical or the mapped bank (the firmware refuses the internal log when SWAP_BANK is set).",
     code: {file: telematics/firmware/platform/u575/flash_u575.c, contains: "FLASH->OPTR & FLASH_OPTR_SWAP_BANK"}}
  - {id: DC09, doc: DS13737, before: M1, question: "Flash page-erase and quad-word program times (typical and maximum), and the LSI frequency range: the watchdog (prescaler /64, reload 1000, about 2 s at 32 kHz) must outlast the longest operation the firmware waits for.",
     code: {file: telematics/firmware/platform/u575/board_u575.c, contains: "IWDG->RLR = 1000u;"}}
  - {id: DC10, doc: ES0499, before: M1, question: "Every erratum for the silicon revisions ES0499 lists that affects MSI PLL mode, LSE, flash program, erase and ECC, read while write, bank swap, TIM input capture and UIF, IWDG and USART; after M1, the revision the banner prints (chip: rev 0x....) selects which apply.",
     code: {file: telematics/firmware/platform/u575/board_u575.c, contains: "DBGMCU_IDCODE_REV_ID"}}
  - {id: DC11, doc: W25Q128JV, before: B0, question: "SOIC-8 pinout (/CS 1, DO 2, /WP 3, GND 4, DI 5, CLK 6, /HOLD 7, VCC 8); supply range and power-up time before the first command; SPI mode 0 and the maximum clock of Read Data 0x03 (the firmware runs SPI1 at 2 MHz).",
     code: {file: telematics/firmware/platform/u575/spi_u575.c, contains: "Mode 0, 8-bit, PCLK2 / 2 = 2 MHz"}}
  - {id: DC12, doc: W25Q128JV, before: B0, question: "JEDEC ID 0x9F returns EF 40 18 for this part (manufacturer EF, capacity code 18 = 16 MiB); the firmware accepts EF with capacity codes 14 to 18 and 3-byte addresses only.",
     code: {file: telematics/firmware/src/tm_w25q.c, contains: "d->jedec[0] != 0xEFu || d->jedec[2] < 0x14u || d->jedec[2] > 0x18u"}}
  - {id: DC13, doc: W25Q128JV, before: B7, question: "Write Enable 0x06 sets WEL (status register 1 bit 1); Read Status Register-1 0x05 with BUSY in bit 0; Sector Erase 0x20 (4 KiB), Page Program 0x02 (up to 256 bytes within one page; what happens past the page end), Chip Erase 0xC7; WEL cleared after each operation.",
     code: {file: telematics/firmware/src/tm_w25q.c, contains: "#define SR1_WEL 0x02u"}}
  - {id: DC14, doc: W25Q128JV, before: B7, question: "Maximum sector-erase, page-program and chip-erase times (tSE, tPP, tCE), against the host model's typical-class values and the ERASE YES wait; the factory state of the block-protect, TB, SEC, CMP and SRP bits (a protected area ignores erase and program without an error flag).",
     code: {file: telematics/firmware/src/tm_w25q.c, contains: "#define CMD_CE 0xC7u"}}
  - {id: DC15, doc: W25Q128JV, before: B0, question: "Factory value of the QE bit for the JVSIQ variant and whether /WP and /HOLD must be tied high in standard SPI (the bench ties both to 3V3).",
     code: {file: telematics/firmware/src/tm_w25q.c, contains: "#define CMD_READ 0x03u"}}
  - {id: DC16, doc: RM0456, before: B11, question: "PLL1 limits in voltage ranges 3 and 4 (160 MHz VCO from MSIS 4 MHz, PLL1Q 20 MHz) and whether the ACTVOSRDY wait is mandatory; FDCAN kernel clock against the 4 MHz APB clock; bus monitoring when an FD frame arrives.",
     code: {file: telematics/firmware/platform/u575/board_u575.c, contains: "PWR_SVMSR_ACTVOSRDY"}}
  - {id: DC17, doc: RM0456, before: B12, question: "I2C TIMINGR at a 4 MHz kernel clock (SCLDEL and SDADEL limits with the analog filter) and whether a STOP follows a NACK with AUTOEND = 0.",
     code: {file: telematics/firmware/platform/u575/i2c_u575.c, contains: "board_gpio_af(GPIOB, 8u, 4u, false, true)"}}
