# Primary documents the controller design needs, in the order they unblock work.
# Source of docs/reference/datasheets/README.md (tools/check_datasheets.py renders it; CI runs --check).
#
# To deliver a document: put the PDF in this folder under the `file` name given (or any name, then set `file`),
# run `python3 tools/check_datasheets.py --record`, which writes its SHA-256 and size here, and type the revision
# and date printed on the document's cover into `received`. A document counts as received only with all four.
# official_url: the manufacturer's page; "unverified" means it could not be opened from the build environment
# (the manufacturers' sites are refused by its network policy), so the address is the expected one, not checked.
schema: sem.datasheets.v1
documents:
  - id: DRV8353
    priority: 1
    manufacturer: Texas Instruments
    part: DRV8353SRTAR (SPI variant, WQFN-40 RTA package)
    document: DRV835x three-phase smart gate driver data sheet, SLVSDY6 (latest revision)
    official_url: https://www.ti.com/product/DRV8353   # unverified
    file: ti-slvsdy6-drv835x.pdf
    unlocks: >-
      Pin numbering and exposed pad of the RTA package (symbol and footprint); supply and logic levels; ENABLE and
      sleep behaviour and whether the current-sense amplifiers work in each state; wake-up and configuration timing;
      SPI framing and the register map; PWM input modes; IDRIVE and TDRIVE gate-drive settings; VDS monitor
      thresholds, deglitch and fault response; fault status and clearing. Closes B-DRV.
    received: null
  - id: INA228
    priority: 2
    manufacturer: Texas Instruments
    part: INA228AIDGSR (VSSOP-10 DGS)
    document: INA228 85-V, 20-bit power/energy/charge monitor with I2C interface, data sheet (latest revision)
    official_url: https://www.ti.com/product/INA228   # unverified
    file: ti-ina228.pdf
