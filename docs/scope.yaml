# Repository scope (v0.7): every tracked file and every test file belongs to one suite.
#
#   telematics  active telematics delivery: sensor acquisition, controller-data reception (receive-only),
#               local logging, uplink, pit tools, energy analysis, shadow-mode diagnostics. It must build,
#               run and pass without building, fabricating or flashing our own motor controller.
#   reference   reusable simulation and reference material: vehicle and optimisation models, the semmc CAN
#               protocol (a SIMULATION FIXTURE until the controller team accepts it), the frozen CSIA
#               evaluation, documentation history.
#   controller  deferred controller development: the controller core and its STM32G474 port, the power-stage
#               hardware, its acceptance procedures, and the legacy supervised simulations that need the
#               controller core. Kept and tested, but nothing in the telematics delivery depends on it.
#
# `modules`: a path prefix and its suite; the longest matching prefix wins. tools/scope.py checks that every
# tracked file matches one and renders docs/generated/scope.md. `tests`: a test file (or file::test) and its
# suite; conftest.py marks every collected test with it (pytest -m telematics, -m reference, -m controller)
# and fails a telematics or reference test that asks for the controller build.

suites:
  telematics: "active telematics delivery"
  reference: "reusable simulation and reference"
  controller: "deferred controller development"

