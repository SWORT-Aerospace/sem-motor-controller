    affects: "ADC sampling times (src/adc.c), IWDG timeout tolerance (src/watchdog.c), MCU footprint, acceptance limits S3.5, S4.3, S4.6; the internal-comparator overcurrent option (DESIGN_REVIEW.md item 5)."
    why: "Several firmware timing values are marked assumptions until these documents confirm them, and the MCU footprint needs the package drawing."
    done_now: "Register sequences and pins verified against ST's CMSIS, HAL/LL sources and pin database; assumptions tagged."
    input: "DS12288, RM0440 and ES0430 PDFs in docs/reference/datasheets/, or network access to st.com."
    closure: "Register rows filled; the [A] values in src/adc.c and src/watchdog.c replaced or confirmed."
