# Blocker-to-evidence register (single source). docs/BLOCKERS.md is generated from this file by
# tools/blockers.py; tools/acceptance.py reads the status of the blockers that acceptance steps name.
#
# Each entry: the specific missing fact or implementation, what it affects, why it matters, what is done now,
# the exact external input, the closure criterion, and the evidence once closed. `unlocks` counts the open
# design items, BOM lines, configuration values and acceptance steps that wait for it (ordering only).
schema: semmc.blockers.v1

battery_as_reported: "Team-reported: 48 V nominal, 10 Ah. Not datasheet-verified. The maximum charged voltage, minimum cut-off voltage, current capability, chemistry and BMS limits are NOT inferred from it."

# The short list: what the team must send, grouped so that one request closes several blockers. Ordered by how
# much engineering work each answer unlocks. Entries with group "team" are decisions or work inside the team.
groups:
  - id: G1
    title: Battery and BMS documents
    request: "Battery and BMS model numbers, a photo of the battery label, and the battery and BMS datasheets (maximum charge voltage, minimum cut-off, cell count, continuous and peak discharge current, charge current limit, short-circuit trip)."
  - id: G2
    title: Motor documents
    request: "Motor model number, nameplate photo, motor datasheet, and photos of the motor's phase, hall and temperature connectors."
  - id: G3
    title: Datasheet PDFs (or network access)
    request: "The PDFs listed in hardware/selection/DATASHEET_REGISTER.md committed to docs/reference/datasheets/ (DRV8353, INA228, DS12288, RM0440, ES0430, MAX6369, TJA1051, LM5164, TLV755P, TLV7041, TL431), or ti.com, st.com, nxp.com, analog.com and onsemi.com added to this environment's allowed domains."
  - id: G4
    title: Vehicle CAN bus description
    request: "Nodes on the bus, bit rate, classic or FD, the identifier block for the motor controller, and where the bus is terminated."
  - id: G5
    title: Harness and mounting
    request: "Photos of the mating connectors with part numbers (battery, motor, halls, motor temperature, driver controls, CAN), and photos and dimensions of where the controller mounts, including any metal plate that can serve as a heatsink."
  - id: G6
    title: Driver controls and sensors
    request: "Pedal model and datasheet, brake and other switch types, the safety-loop voltage and wiring, and the choice of power-stage NTC."
  - id: G7
    title: Event and rules
    request: "The event name and the official rule PDF of the edition that applies."

blockers:
  - id: B-BAT-V
    status: open
    group: G1
    title: Battery maximum and minimum voltage
    missing: "Maximum charged pack voltage V_bat,max and minimum (BMS cut-off) voltage V_bat,min are unavailable; only 48 V nominal is reported."
    affects: "MOSFET V_DS class and DC-link capacitor voltage rating (sheets 02, 03); TVS stand-off and clamp, fuse voltage, precharge resistor energy, bypass FET V_DS and Zener current (sheet 01); over-voltage trip divider (sheet 02); LM5164 UVLO divider and input capacitors (sheet 12); config battery.*, limits.overvoltage_trip_V, limits.undervoltage_trip_V, limits.undervoltage_derate_V."
    why: "Every power-path rating is written as a multiple of V_bat,max; a 48 V nominal pack can charge well above 48 V depending on chemistry and cell count, so no voltage class can be chosen safely from the nominal."
    done_now: "Rating rules written against V_bat,max (hardware/review/DESIGN_REVIEW.md items 2, 3, 6, 8); over-voltage comparator topology and hysteresis fixed; firmware reads every threshold from the calibration and refuses to run without it."
    input: "Battery model number and label photo; battery and BMS datasheets giving maximum charge voltage, minimum discharge cut-off voltage and cell count."
    closure: "docs/INPUT_SHEET.md battery items filled with document and page; config battery.* and voltage limits filled; the divider, UVLO and voltage-class parts selected."
    unlocks: 24

  - id: B-BAT-I
    status: open
    group: G1
    title: Battery and BMS current limits
    missing: "Continuous and peak discharge current, regenerative charge current limit, BMS short-circuit response; 10 Ah is a capacity, not a current."
    affects: "Fuse rating and breaking capacity, bus shunt and INA228 range, battery connector J101 and cable (sheet 01); config limits.battery_current_limit_A; regeneration policy."
    why: "The fuse must clear a fault the BMS does not, and the bus shunt must cover the real current range for the energy measurement."
    done_now: "Rating rules recorded; the controller limits battery current from the calibration only."
    input: "BMS datasheet: continuous and peak discharge current, charge current limit, short-circuit trip and its delay."
    closure: "Values in docs/INPUT_SHEET.md with source; fuse, shunt and connector selected."
    unlocks: 8

  - id: B-MOTOR
    status: open
    group: G2
    title: Motor data
    missing: "Motor model, continuous and peak phase current, pole pairs, phase resistance and inductance, flux linkage or K_v, hall output type and supply, temperature sensor type."
    affects: "MOSFET current rating, phase shunts, CSA gain, DC-link ripple current (sheets 02, 03, 05); hall supply jumper and pull-ups (sheet 09); motor temperature bias (sheet 07); connectors J301, J701, J901; config motor.*, limits.max_phase_current_A, inverter.hw_overcurrent_trip_A."
    why: "The power stage is sized from the motor's currents, and the current controller and hall commutation need its parameters."
    done_now: "Envelope calculations over a current range; firmware handles any pole count and hall table from the calibration."
    input: "Motor model number and nameplate photo; motor datasheet; the hall connector and sensor connector photos."
    closure: "docs/INPUT_SHEET.md motor items filled with sources; config motor.* marked datasheet or measured."
    unlocks: 22

  - id: B-DRV
    status: open
    group: G3
    title: DRV8353 gate-driver datasheet
    missing: "TI DRV8353 datasheet (SLVSDY6x) not read: pin numbers, operating limits, SPI register map, IDRIVE, VDS trip levels and deglitch, CSA gain/offset/settling, input pull-downs, behaviour with ENABLE low."
    affects: "U401 symbol (placeholder pins) and its footprint (sheet 04); firmware GATE_DRIVER_CONFIGURED and the boot offset measurement (firmware/platform/stm32g4/src/main.c); acceptance S5.7, S7, S8."
    why: "Without the pinout no footprint or layout of the gate drive is possible; without the register map the firmware cannot enable the driver, so the motor cannot be driven."
    done_now: "Placeholder symbol marked; firmware keeps DRV_ENABLE low; nFAULT break path verified; the six gate-signal pull-downs fitted."
    input: "The SLVSDY6 PDF committed to docs/reference/datasheets/, or network access to ti.com for this environment."
    closure: "DATASHEET_REGISTER.md row filled with revision and pages; U401 renumbered and pin-checked; driver configuration implemented and acceptance S5.7 passed."
    unlocks: 15

  - id: B-INA
    status: open
    group: G3
    title: INA228 register map
    missing: "TI INA228 datasheet not read: register addresses, shunt calibration, VBUS and current scaling, conversion timing."
    affects: "Firmware battery-side voltage and current (src/main.c: ibatt missing); precharge completion (mc_precharge never closes); controller energy measurement; acceptance S6.3 to S6.5."
    why: "The precharge bypass may only close when the link voltage is compared with the battery-side voltage, which this meter provides."
    done_now: "Precharge state machine with timeout and post-close failure detection implemented and host-tested; the firmware reports the meter as missing."
    input: "The INA228 PDF committed to docs/reference/datasheets/, or network access to ti.com."
    closure: "Driver implemented, host-tested against the datasheet's register examples, and acceptance S6.3 passed."
    unlocks: 6

