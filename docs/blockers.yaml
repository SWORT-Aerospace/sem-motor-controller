    why: "The firmware keeps CAN off until the bit rate and crystal are known; supervised ECO mode needs the bus."
    done_now: "Bit timing computed and host-tested for 125 k to 1 Mbit/s on a 16 MHz kernel; FDCAN driver with hardware filter and bus-off recovery; the controller drives manually without CAN."
    input: "The vehicle team's bus description: nodes, bit rate, frame format, identifier allocation, where the bus is terminated."
    closure: "docs/ICD.md section 2 confirmed; calibration values set; crystal selected; acceptance S9.1 passed."
    unlocks: 7

