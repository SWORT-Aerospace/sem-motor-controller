# Blocker-to-evidence register (single source). docs/BLOCKERS.md is generated from this file by
# tools/blockers.py; tools/acceptance.py reads the status of the blockers that acceptance steps name.
#
# Each entry: the specific missing fact or implementation, what it affects, why it matters, what is done now,
# the exact external input, the closure criterion, and the evidence once closed. `unlocks` counts the open
# design items, BOM lines, configuration values and acceptance steps that wait for it (ordering only).
schema: semmc.blockers.v1
# v0.7: `track` says whom an open item blocks: telematics (the delivery), controller (the deferred controller
# development only) or both. Controller items never block the telematics critical path.

battery_as_reported: "Team-reported: 48 V nominal, 10 Ah. Not datasheet-verified. The maximum charged voltage, minimum cut-off voltage, current capability, chemistry and BMS limits are NOT inferred from it."

# The short list. `audience: physical` groups are the seven requests to the physical team, documents and photos
# first, in this order; none asks them for register values or MCU details. `audience: documentation` is the
# primary-document request (PDF uploads or network access), for whoever can provide it. Entries with group "team"
# are decisions or work inside the team.
groups:
  - id: P1
    audience: physical
    title: Battery and BMS
    request: "Battery and BMS model numbers, a photo of the battery label, and the battery and BMS datasheets (maximum charge voltage, minimum cut-off, cell count, continuous and peak discharge current, charge current limit, short-circuit trip)."
  - id: P2
    audience: physical
    title: Motor
    request: "Motor model number, nameplate photo, motor datasheet, and photos of the motor's phase, hall and temperature connectors."
  - id: P3
    audience: physical
    title: Drivetrain
    request: "Wheel circumference (or tyre size), the gear or chain ratio between motor and wheel, whether there is a freewheel, and the vehicle mass with driver."
  - id: P4
    audience: physical
    title: Controls and safety
    request: "Pedal model and datasheet, the brake and other switch types (normally open or closed), how the emergency stop, dead-man and safety loop are wired and at what voltage, and a photo of the dashboard controls."
  - id: P5
    audience: physical
    title: Vehicle CAN bus
    request: "If the vehicle has a CAN bus: the nodes on it, bit rate, classic or FD, the identifier block for the motor controller, and where it is terminated. If no bus exists yet, this is a team design decision: whether the controller needs one and what else would sit on it."
  - id: P6
    audience: physical
    title: Mechanics and harness
    request: "Photos and part numbers of the mating connectors (battery, motor, halls, motor temperature, driver controls, CAN), and photos and dimensions of where the controller mounts, including any metal plate that can serve as a heatsink."
  - id: P7
    audience: physical
    title: Event
    request: "The event name and the official rule PDF of the edition that applies."
  - id: C1
    audience: controller_team
    title: Controller interface (the controller team)
    request: "The answers to docs/CONTROLLER_INTERFACE_REQUEST.md: controller model and contact; bus type, bit rate, termination, transceiver, connector and ground; the DBC or message definitions with a recording; the essential DC voltage and current with their rates, accuracy and delay."
  - id: D1
    audience: documentation
    title: Primary documents (PDF upload or network access)
    request: "The PDFs listed in docs/reference/datasheets/README.md committed to docs/reference/datasheets/, or ti.com, st.com, nxp.com, analog.com and onsemi.com added to this environment's allowed domains. Not a physical-team task."

blockers:
  - id: B-BAT-V
    status: open
    track: both
    group: P1
    title: Battery maximum and minimum voltage
    missing: "Maximum charged pack voltage V_bat,max and minimum (BMS cut-off) voltage V_bat,min are unavailable; only 48 V nominal is reported."
    affects: "MOSFET V_DS class and DC-link capacitor voltage rating (sheets 02, 03); TVS stand-off and clamp, fuse voltage, precharge resistor energy, bypass FET V_DS and Zener current (sheet 01); over-voltage trip divider (sheet 02); LM5164 UVLO divider and input capacitors (sheet 12); config battery.*, limits.overvoltage_trip_V, limits.undervoltage_trip_V, limits.undervoltage_derate_V. Telematics: the unit's vehicle supply (T-VEH-PWR)."
    why: "Every power-path rating is written as a multiple of V_bat,max; a 48 V nominal pack can charge well above 48 V depending on chemistry and cell count, so no voltage class can be chosen safely from the nominal."
    done_now: "Rating rules written against V_bat,max (hardware/review/DESIGN_REVIEW.md items 2, 3, 6, 8); over-voltage comparator topology and hysteresis fixed; firmware reads every threshold from the calibration and refuses to run without it."
    input: "Battery model number and label photo; battery and BMS datasheets giving maximum charge voltage, minimum discharge cut-off voltage and cell count."
    closure: "docs/INPUT_SHEET.md battery items filled with document and page; config battery.* and voltage limits filled; the divider, UVLO and voltage-class parts selected."
    unlocks: 24

  - id: B-BAT-I
    status: open
    track: controller
    group: P1
    title: Battery and BMS current limits
    missing: "Continuous and peak discharge current, regenerative charge current limit, BMS short-circuit response; 10 Ah is a capacity, not a current."
    affects: "Fuse rating and breaking capacity, bus shunt and INA228 range, battery connector J101 and cable (sheet 01); config limits.battery_current_limit_A; regeneration policy."
    why: "The fuse must clear a fault the BMS does not, and the bus shunt must cover the real current range for the energy measurement."
    done_now: "Rating rules recorded; the controller limits battery current from the calibration only."
    input: "BMS datasheet: continuous and peak discharge current, charge current limit, short-circuit trip and its delay."
    closure: "Values in docs/INPUT_SHEET.md with source; fuse, shunt and connector selected."
    unlocks: 8

